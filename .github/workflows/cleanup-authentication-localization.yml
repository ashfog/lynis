name: Clean authentication localization text

on:
  push:
    branches: [master]
    paths: [.github/workflows/cleanup-authentication-localization.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Fix mixed-language LDAP message
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('include/tests_authentication')
          text = path.read_text(encoding='utf-8')
          old = '结果：文件 ${FILE} 存在, LDAP being used'
          new = '结果：文件 ${FILE} 存在，正在使用 LDAP'
          if old not in text:
              raise SystemExit('mixed-language LDAP message not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          sh -n include/tests_authentication
      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/cleanup-authentication-localization.yml
          git config user.name "AshFog Localization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add include/tests_authentication .github/workflows/cleanup-authentication-localization.yml
          git commit -m "i18n: clean mixed authentication message"
          git push origin HEAD:master
