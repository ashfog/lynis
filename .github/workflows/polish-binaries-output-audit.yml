name: One-time polish binary output and audit messages

on:
  push:
    branches: [master]
    paths: [.github/workflows/polish-binaries-output-audit.yml]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Normalize detected program output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path=Path('include/binaries')
          lines=path.read_text(encoding='utf-8').splitlines(keepends=True)
          case_re=re.compile(r'^(\s*)([A-Za-z0-9_.+|-]+)\)')
          log_re=re.compile(r'LogText "((?:\\.|[^"\\])*)"')

          desc_fixes={
            '网络服务器':'Web 服务器','包管理器':'软件包管理器','包管理':'软件包管理',
            '用于测试易受攻击的包的审核实用程序':'软件包漏洞审计工具','审核框架':'审计框架',
            '字符串工具':'文本处理工具','审计守护程序的控制实用程序':'auditd 控制工具',
            '空闲会话杀手':'空闲会话终止工具','有关块设备的信息':'块设备信息',
            'systemd-启动管理器实用程序':'systemd-boot 管理工具',' (IDS)':'（IDS）',
            '通用文件处理':'通用文件处理工具','有关 ClamAV 的信息':'ClamAV 配置信息',
            '(AV 扫描仪)':'（杀毒扫描器）','cfengine代理':'CFEngine 代理',
            '恶意软件扫描程序':'恶意软件扫描器','程序包漏洞检查':'软件包漏洞检查',
            '包完整性检查':'软件包完整性检查','网络/dns工具':'网络/DNS 工具',
            '硬件收集工具':'硬件信息收集工具','NIS 域':'NIS 域查询',
            'IMA/EVM工具':'IMA/EVM 工具','引导加载程序的安装程序':'引导加载器安装工具',
            '压缩实用程序':'压缩工具','新贵 init 的客户端':'Upstart 客户端',
            'IP配置':'IP 配置','launchd客户端':'launchd 客户端','日志旋转工具':'日志轮转工具',
            'LVM工具':'LVM 工具','kernel 模块':'内核模块','磁盘实用程序':'磁盘工具',
            'openntpd 客户端':'OpenNTPD 客户端','时间守护进程客户端':'NTP 客户端',
            'postfix 配置':'Postfix 配置','postfix 二进制文件':'Postfix 服务程序',
            'pf 防火墙的客户端':'PF 防火墙客户端','puppet 主守护程序':'Puppet 主守护进程',
            '服务和守护程序配置和控制':'服务与守护进程管理','遵循符号链接':'解析符号链接',
            'shell 包装器':'Shell 包装器','RPC信息':'RPC 信息','系统实用程序':'系统工具',
            'SaltStack master':'SaltStack 主服务器','SELinux策略管理工具':'SELinux 策略管理工具',
            'SELinux状态工具':'SELinux 状态工具','NFS 安装':'NFS 挂载信息',
            '开放网络套接字':'打开的网络套接字','显示套接字':'套接字信息',
            'Synology AV 扫描仪':'Synology 杀毒扫描器','systemd服务分析工具':'systemd 服务分析工具',
            'timedate 客户端':'时间日期管理客户端','tomoyo 组件':'TOMOYO 组件',
            'tomoyo进程树':'TOMOYO 进程树','文本操作实用程序':'文本处理工具',
            'USB安全工具':'USB 安全工具','VMWare 工具':'VMware 工具','字数':'字符/单词统计',
            '命令输出重定向':'命令参数构造工具','映射目录树':'目录树映射工具',
            '网络统计':'网络统计信息','内核功能':'内核能力','完整性工具':'文件完整性工具',
            '代理':'代理服务器','系统服务':'系统服务管理','文件比较':'文件比较工具',
            '文件信息':'文件信息工具','文件数据库':'文件索引数据库','文件列表':'文件列表工具',
            '文本流编辑器':'文本流处理工具','文本过滤器':'文本过滤工具','文本转换':'文本转换工具',
            '名称服务切换库的查询工具':'名称服务查询工具','块设备':'块设备信息',
            '卷管理器':'卷管理工具','交换设备工具':'交换设备管理工具','内核参数':'内核参数管理',
            '操作系统详细信息':'操作系统信息','压缩文件的文本搜索':'压缩文件文本搜索',
          }

          special_names={
            'cmd_daemon':'cmd','sha1|sha1sum|shasum':'sha1/sha1sum/shasum',
            'sha256|sha256sum':'sha256/sha256sum',
          }

          output=[]
          for line in lines:
            cm=case_re.match(line);lm=log_re.search(line)
            if cm and lm:
              pattern=cm.group(2)
              message=lm.group(1)
              if any(token in message for token in ('已知程序','已知的二进制','已知二进制','已知的二进制文件','已知二进制文件')):
                name=special_names.get(pattern,pattern.replace('|','/'))
                # Keep variable-based Python display names and version-only lines untouched.
                if '${FILENAME}' not in message and not message.startswith(('发现 ${BINARY}','找到${BINARY}','找到已知的二进制文件 ${BINARY}')):
                  positions=[p for p in (message.find('（'),message.find(' ('),message.find(' - '),message.find('-${BINARY}')) if p>=0]
                  suffix=message[min(positions):] if positions else f' - ${{BINARY}}'
                  if suffix.startswith(' ('):
                    suffix='（'+suffix[2:]
                    if ') - ' in suffix:suffix=suffix.replace(') - ','） - ',1)
                  if suffix.startswith('-${BINARY}'):
                    suffix=' - ${BINARY}'
                  message=f'发现已知程序：{name}{suffix}'
                for old,new in sorted(desc_fixes.items(),key=lambda x:len(x[0]),reverse=True):
                  message=message.replace(old,new)
                message=message.replace('）-${BINARY}','） - ${BINARY}')
                message=message.replace(')- ${BINARY}',') - ${BINARY}')
                message=message.replace('）- ${BINARY}','） - ${BINARY}')
                message=message.replace('(IDS)','（IDS）')
                message=message.replace('(krb5)','（Kerberos）')
                message=message.replace('(systemd 日志)','（systemd 日志）')
                message=message.replace('(systemd-resolved DNS 解析器管理器)','（systemd-resolved DNS 解析器管理器）')
                message=message.replace('(SaltStack master)','（SaltStack 主服务器）')
                line=line[:lm.start(1)]+message+line[lm.end(1):]
            output.append(line)

          text=''.join(output)
          exact={
            'LogText "发现已知程序：bro（IDS） - ${BINARY}"':'LogText "发现已知程序：bro（IDS） - ${BINARY}"',
            'LogText "发现已知程序：domainname（NIS 域查询） - ${BINARY}"':'LogText "发现已知程序：domainname（NIS 域查询） - ${BINARY}"',
            'LogText "发现已知程序：equery（软件包管理器） - ${BINARY}"':'LogText "发现已知程序：equery（软件包管理器） - ${BINARY}"',
            'LogText "发现已知程序：file（文件类型检测） - ${BINARY}"':'LogText "发现已知程序：file（文件类型检测） - ${BINARY}"',
            'LogText "发现已知程序：ifconfig（IP 配置） - ${BINARY}"':'LogText "发现已知程序：ifconfig（IP 配置） - ${BINARY}"',
            'LogText "发现已知程序：prelink（系统优化器） - ${BINARY}"':'LogText "发现已知程序：prelink（系统优化器） - ${BINARY}"',
            'LogText "发现已知程序：runlevel（系统工具） - ${BINARY}"':'LogText "发现已知程序：runlevel（系统工具） - ${BINARY}"',
            'LogText "发现已知程序：sort（排序数据流） - ${BINARY}"':'LogText "发现已知程序：sort（数据流排序工具） - ${BINARY}"',
            'LogText "发现已知程序：strings（文本字符串搜索） - ${BINARY}"':'LogText "发现已知程序：strings（可打印字符串搜索） - ${BINARY}"',
            'LogText "结果：目录 ${SCANDIR} 是否存在 NOT"':'LogText "结果：目录 ${SCANDIR} 不存在"',
            'LogText "结果：找到 ${COUNT} 二进制文件，包括 ${NSUID_BINARIES} set-uid 和 ${NSGID_BINARIES} set-gid"':'LogText "结果：发现 ${COUNT} 个程序，其中 ${NSUID_BINARIES} 个设置了 set-uid，${NSGID_BINARIES} 个设置了 set-gid"',
            'LogText "结果：set-uid 二进制文件：${SUID_BINARIES}"':'LogText "结果：设置了 set-uid 的程序：${SUID_BINARIES}"',
            'LogText "结果：set-gid 二进制文件：${SGID_BINARIES}"':'LogText "结果：设置了 set-gid 的程序：${SGID_BINARIES}"',
          }
          for old,new in exact.items():text=text.replace(old,new)
          text=re.sub(r'ExitFatal "([A-Za-z0-9_.+/-]+) binary not found"',r'ExitFatal "未找到 \1 程序"',text)
          path.write_text(text,encoding='utf-8')
          PY
          sh -n include/binaries

      - name: Audit potentially missed output functions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re

          q=re.compile(r'"((?:\\.|[^"\\])*)"')
          call=re.compile(r'^\s*([A-Z][A-Za-z0-9_]*)\s+')
          cjk=re.compile(r'[\u3400-\u9fff]')
          grammar=re.compile(r'\b(result|test|checking|found|find|search|warning|error|fatal|not found|missing|please|unable|unknown|skipped|failed|should|could|would|available|configuration|status|file|directory|binary)\b',re.I)
          known={'Register','Display','LogText','ReportWarning','ReportSuggestion','ReportException','DisplayError','DisplayWarning','DisplaySuggestion','ExitFatal','SKIPREASON'}
          ignored={'Report','Debug','AddHP','InsertSection','WaitForKeyPress','ShowSymlinkPath','SafeInput','IsRunning','IsVerbose','IsEmpty','HasData','SkipAtomicTest','TestValue'}
          rows=[];counts=Counter()
          files=[Path('lynis')]+sorted(p for p in Path('include').iterdir() if p.is_file())
          for p in files:
            try:lines=p.read_text(encoding='utf-8').splitlines()
            except UnicodeDecodeError:continue
            for n,line in enumerate(lines,1):
              s=line.lstrip()
              if not s or s.startswith('#'):continue
              m=call.match(line)
              if not m:continue
              fn=m.group(1)
              if fn in ignored:continue
              vals=[x.group(1) for x in q.finditer(line)]
              for v in vals:
                if cjk.search(v):continue
                cleaned=re.sub(r'\$\{[^}]+\}|\$[A-Za-z_][A-Za-z0-9_]*|https?://\S+|/\S+|--\S+|\[[^]]+\]',' ',v)
                if grammar.search(cleaned) or len(re.findall(r'[A-Za-z]{2,}',cleaned))>=4:
                  rows.append(f'{p}:{n}:{fn}: {v}');counts[fn]+=1
          out=['# Potentially missed user-visible output','# Count: '+str(len(rows)),'','# Counts by function']+[f'# {n:4d} {fn}' for fn,n in counts.most_common()]+['',*rows,'']
          Path('OUTPUT_FUNCTION_AUDIT.txt').write_text('\n'.join(out),encoding='utf-8')
          print(len(rows),dict(counts))
          PY

      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/polish-binaries-output-audit.yml
          git config user.name "AshFog Localization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "i18n: polish detected program output and audit messages"
          git push origin HEAD:master
