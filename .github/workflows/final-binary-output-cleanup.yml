name: One-time final detected program cleanup

on:
  push:
    branches: [master]
    paths: [.github/workflows/final-binary-output-cleanup.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Clean detected program messages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('include/binaries')
          text = path.read_text(encoding='utf-8')
          fixes = {
              '软件软件包管理器': '软件包管理器',
              '软件软件包管理': '软件包管理',
              '块设备信息信息': '块设备信息',
              '块设备信息加密': '块设备加密',
              '（AV 扫描仪）': '（杀毒扫描器）',
              '发现已知的二进制文件：': '发现已知程序：',
              '发现已知二进制文件：': '发现已知程序：',
              '发现已知的二进制：': '发现已知程序：',
              '发现已知二进制：': '发现已知程序：',
              '找到已知的二进制文件 ${BINARY}（版本 ${EXIMVERSION}）': '发现 ${BINARY}（版本 ${EXIMVERSION}）',
              '找到${BINARY}（版本：${MYSQLCLIENTVERSION}）': '发现 ${BINARY}（版本 ${MYSQLCLIENTVERSION}）',
              '找到${BINARY}（版本${OPENSSLVERSION}）': '发现 ${BINARY}（版本 ${OPENSSLVERSION}）',
              '找到${BINARY}（版本${PERLVERSION}）': '发现 ${BINARY}（版本 ${PERLVERSION}）',
              '找到${BINARY}（版本${SSHDVERSION}）': '发现 ${BINARY}（版本 ${SSHDVERSION}）',
              'pacman（包管理器）-${BINARY}': 'pacman（软件包管理器） - ${BINARY}',
              'lsof（打开文件）-${BINARY}': 'lsof（打开文件信息） - ${BINARY}',
              'cfagent（配置工具）': 'cfagent（CFEngine 配置代理）',
              'kadmin.local（krb5）': 'kadmin.local（Kerberos）',
              'kdb5_util（krb5）': 'kdb5_util（Kerberos）',
              'tripwire（文件完整性）': 'tripwire（文件完整性工具）',
              '（版本${PHPVERSION}）': '（版本 ${PHPVERSION}）',
              '（版本${PYTHONVERSION}）': '（版本 ${PYTHONVERSION}）',
              '（版本${PYTHON2VERSION}）': '（版本 ${PYTHON2VERSION}）',
              '（版本${PYTHON3VERSION}）': '（版本 ${PYTHON3VERSION}）',
              'LogText " 发现': 'LogText "发现',
              '发现已知程序：clamscan（AV 扫描仪）': '发现已知程序：clamscan（杀毒扫描器）',
              '发现已知程序：cryptsetup（块设备信息加密）': '发现已知程序：cryptsetup（块设备加密）',
              '发现已知程序：blkid（块设备信息信息）': '发现已知程序：blkid（块设备信息）',
              '发现已知程序：apt（软件软件包管理器）': '发现已知程序：apt（软件包管理器）',
              '发现已知程序：apk（软件软件包管理器）': '发现已知程序：apk（软件包管理器）',
              '发现已知程序：dnf（软件软件包管理器）': '发现已知程序：dnf（软件包管理器）',
              '发现已知程序：equery（软件软件包管理器）': '发现已知程序：equery（软件包管理器）',
              '发现已知程序：rpm（软件软件包管理器）': '发现已知程序：rpm（软件包管理器）',
              '发现已知程序：swupd（软件软件包管理器）': '发现已知程序：swupd（软件包管理器）',
              '发现已知程序：yum（软件软件包管理器）': '发现已知程序：yum（软件包管理器）',
              '发现已知程序：zypper（软件软件包管理器）': '发现已知程序：zypper（软件包管理器）',
              '发现已知程序：pkg（软件软件包管理）': '发现已知程序：pkg（软件包管理）',
              '发现已知程序：pkg_admin（软件软件包管理）': '发现已知程序：pkg_admin（软件包管理）',
          }
          before = text
          for old, new in fixes.items():
              text = text.replace(old, new)
          if text == before:
              raise SystemExit('no binary output changes applied')
          path.write_text(text, encoding='utf-8')
          PY
          sh -n include/binaries

      - name: Remove temporary diagnostic and commit
        shell: bash
        run: |
          rm -f BINARY_POLISH_DIAGNOSTIC.txt
          rm -f .github/workflows/final-binary-output-cleanup.yml
          git config user.name "AshFog Localization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "i18n: finalize detected program messages"
          git push origin HEAD:master
