name: One-time complete user-output audit

on:
  push:
    branches: [master]
    paths: [.github/workflows/audit-all-user-output.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Audit literal text in active output paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re

          quoted = re.compile(r'"((?:\\.|[^"\\])*)"')
          capital_call = re.compile(r'^\s*([A-Z][A-Za-z0-9_]*)\b')
          cjk = re.compile(r'[\u3400-\u9fff]')
          english = re.compile(r'[A-Za-z]{2,}')
          english_grammar = re.compile(
              r'\b(result|test|checking|check|found|find|search|warning|error|fatal|notice|note|information|info|risk|suggestion|exception|missing|not found|could not|cannot|unable|unknown|please|skipped|failed|available|configuration|status|file|directory|binary|program|service|system|package|network|user|password|permission|running|installed|enabled|disabled|update|version)\b',
              re.I,
          )
          output_calls = {
              'Register','Display','LogText','ReportWarning','ReportSuggestion','ReportException',
              'DisplayError','DisplayWarning','DisplaySuggestion','ExitFatal','DisplayProgramHeader',
              'DisplayReport','DisplaySection','DisplayMessage','ShowComplianceFinding','ShowSuggestion',
              'ShowWarning','ShowException','ShowResult','PrintText','PrintMessage','Warning','Error',
          }
          non_output_calls = {
              'Report','Debug','AddHP','InsertSection','WaitForKeyPress','ShowSymlinkPath','SafeInput',
              'IsRunning','IsVerbose','IsEmpty','HasData','SkipAtomicTest','TestValue','RegisterAtomicTest',
              'GetValue','GetFilePermissions','GetFileOwner','GetFileGroup','IsReadable','IsWorldWritable',
              'IsWorldExecutable','GetDaemonStatus','StoreSettings','StoreNginxSettings','RandomString',
              'AddConfigFile','FindFile','SearchFile','SearchDirectory','GetHostID','GetHostID2',
          }
          technical_only = re.compile(r'^[\s${}A-Za-z0-9_.:/=+*?^|\\()\[\],;-]+$')

          def suspicious(value):
              if cjk.search(value):
                  return False
              value=value.strip()
              if not value or value.startswith(('http://','https://','ftp://')):
                  return False
              if technical_only.fullmatch(value) and len(english.findall(value)) < 3:
                  return False
              cleaned=re.sub(r'\$\{[^}]+\}|\$[A-Za-z_][A-Za-z0-9_]*|/\S+|--\S+|\[[^]]+\]|https?://\S+|\([^)]*[=/$][^)]*\)', ' ', value)
              return bool(english_grammar.search(cleaned)) or len(english.findall(cleaned)) >= 4

          files=[Path('lynis')]+sorted(p for p in Path('include').iterdir() if p.is_file())
          rows=[];counts=Counter();unknown_counts=Counter()
          for path in files:
              try: lines=path.read_text(encoding='utf-8').splitlines()
              except UnicodeDecodeError: continue
              for number,line in enumerate(lines,1):
                  stripped=line.lstrip()
                  if not stripped or stripped.startswith('#'):
                      continue
                  values=[m.group(1) for m in quoted.finditer(line)]
                  if not values:
                      continue
                  function=''
                  match=capital_call.match(line)
                  if match:
                      function=match.group(1)
                  direct=bool(re.match(r'^(?:if .*; then )?(?:echo|printf)\b', stripped))
                  if function in non_output_calls and not direct:
                      continue
                  candidate_function = function in output_calls or direct
                  suspicious_values=[v for v in values if suspicious(v)]
                  if not suspicious_values:
                      continue
                  if candidate_function:
                      for value in suspicious_values:
                          rows.append(f'{path}:{number}:{function or "direct"}: {value}')
                          counts[function or 'direct']+=1
                  elif function:
                      for value in suspicious_values:
                          rows.append(f'{path}:{number}:UNKNOWN-{function}: {value}')
                          unknown_counts[function]+=1

          out=[
              '# Complete user-output audit',
              f'# Suspicious strings: {len(rows)}',
              '',
              '# Known/direct output functions',
              *[f'# {count:4d} {name}' for name,count in counts.most_common()],
              '',
              '# Unknown capitalized calls with suspicious strings',
              *[f'# {count:4d} {name}' for name,count in unknown_counts.most_common()],
              '',
              *rows,
              '',
          ]
          Path('COMPLETE_USER_OUTPUT_AUDIT.txt').write_text('\n'.join(out),encoding='utf-8')
          print(f'suspicious={len(rows)} known={dict(counts)} unknown={dict(unknown_counts)}')
          PY

      - name: Commit report and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/audit-all-user-output.yml
          git config user.name "AshFog Localization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add COMPLETE_USER_OUTPUT_AUDIT.txt .github/workflows/audit-all-user-output.yml
          git commit -m "chore: audit all user-visible output paths"
          git push origin HEAD:master
