name: One-time final comprehensive output audit

on:
  push:
    branches: [master]
    paths: [.github/workflows/final-comprehensive-output-audit.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Audit every user-output string surface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re

          Q=re.compile(r'"((?:\\.|[^"\\])*)"')
          CJK=re.compile(r'[\u3400-\u9fff]')
          WORD=re.compile(r"[A-Za-z][A-Za-z'-]*")
          GRAMMAR=re.compile(r'\b(result|test|testing|checking|check|search|searching|found|find|warning|error|fatal|exception|notice|note|information|info|risk|suggestion|missing|not found|could not|cannot|unable|unknown|please|skipped|failed|available|configuration|status|file|directory|binary|program|service|system|package|network|user|password|permission|running|installed|enabled|disabled|update|version|details|steps|ensure|include|replace|deprecated|language|mode|role|upload|proxy|logging|show|perform|incorrect|usage|expected|received|parameter|argument|function|called|without)\b',re.I)
          TECH_TERMS=[
            'Linux','FreeBSD','OpenBSD','NetBSD','DragonFly','Solaris','AIX','HP-UX','macOS','BSD','UNIX','Lynis','CISOfy','GitHub',
            'systemd','SysV','OpenRC','runit','launchd','SMF','syslog','rsyslog','syslog-ng','journald','systemd-journal','systemd-resolved','systemd-timesyncd',
            'nginx','Apache','Postfix','Exim','OpenSMTPD','PHP','Perl','Python','Ruby','SSH','OpenSSH','SSL','TLS','OpenSSL','NTP','OpenNTPD','chrony','chronyd','ntpd',
            'DNS','DNSSEC','BIND','Unbound','PowerDNS','IPv4','IPv6','TCP','UDP','PAM','RPM','APT','YUM','DNF','pacman','apk','pkg','Portage','Docker','Podman','KVM','Xen','LXC','OpenVZ','VMware','VirtualBox','Hyper-V',
            'MySQL','MariaDB','PostgreSQL','Redis','MongoDB','Oracle','DB2','Squid','SNMP','NFS','USB','USBGuard','UEFI','Secure Boot','GRUB','GRUB2','LILO','ELILO','SILO','YABOOT','SELinux','AppArmor','TOMOYO','iptables','nftables','IPFW','PF',
            'CVE','UID','GID','FQDN','MTU','ARP','DHCP','LDAP','NIS','NIS+','Kerberos','sudo','doas','BusyBox','Wazuh','OSSEC','auditd','Snoopy','HostID','HOSTID','MAC','PATH','API','URL','ClamAV','CUPS','TraceEnable','VM','EC2','AWS','GCP','Azure','SCTP','DCCP','RDS','TIPC','OOM','ACL','I/O','LSM','LUKS','GPG','GLSA','PID','EOL','TXT','SDK','CLI','IDS','IPS','AV','CSF','LMD','LVM','RPC','TAR','DEB','SaltStack','Puppet','CFEngine','Cfengine','Ansible','Fail2Ban','Rootkit Hunter','Linux Malware Detect','falcon-sensor','Trend Micro','Synology Antivirus Essential','Wazuh Agent',
            'mod_evasive','mod_reqtimeout','mod_qos','root','localhost','cron','crontab','logrotate','newsyslog','auditctl','sestatus','semanage','aa-status','apparmor_status','register_globals','expose_php','enable_dl','allow_url_fopen','allow_url_include','disable_vrfy_command','Safe_ports','reply_body_max_size','httpd_suppress_version_string','ProcessSizeMax','Storage','ulimit','step-tickers','hidepid','nodev','noexec','nosuid','swappiness','falseticker','stratum','SUID','SGID','set-uid','set-gid','chroot',
          ]
          ORDINARY={
            'a','an','the','and','or','to','of','for','in','on','with','from','is','are','was','were','be','been','being','has','have','had','can','cannot','could','should','would','may','might','must','will','not','no','yes','all','any','some','none','check','checking','checked','result','test','testing','search','searching','scan','scanning','found','find','finding','query','querying','file','files','directory','directories','folder','path','location','system','service','services','process','processes','package','packages','configuration','configured','option','options','setting','settings','status','warning','error','note','notice','information','info','risk','suggestion','exception','enable','enabled','disable','disabled','running','installed','available','missing','invalid','valid','permissions','permission','user','users','group','groups','password','network','protocol','port','ports','remote','local','update','updates','version','current','latest','newer','older','old','outdated','audit','security','support','tool','tools','binary','binaries','manager','client','server','daemon','module','modules','kernel','boot','log','logs','report','profile','plugin','plugins','custom','using','used','use','please','help','needed','required','detected','active','inactive','failed','failure','skipped','skipping','start','starting','finished','successful','successfully','details','more','less','than','this','that','these','those','your','our','its','it','as','due','because','if','when','while','only','also','first','last','new','additional','possible','unknown','unexpected','incorrect','correct','readable','writable','owned','owner','value','values','method','mode','type','program','command','commands','output','data','action','outcome','determine','review','verify','validate','change','set','add','remove','delete','create','stop','restart','run','perform','read','write','load','import','include','including','exclude','install','upgrade','download','language','translation','hostname','hardware','platform','work','end','life','marked','date','month','months','year','years','day','days','time','source','sources','candidate','candidates','entry','entries','line','lines','list','array','queue','key','keys','string','strings','device','devices','interface','interfaces','address','addresses','vendor','product','physical','container','virtualization','virtual','machine','task','tasks','memory','disk','volume','partition','swap','scheduler','statistics','database','framework','policy','policies','domain','domains','resolver','host','hosts','connection','connections','socket','sockets','traffic','certificate','certificates','encryption','hash','integrity','vulnerability','vulnerabilities','authentication','shell','session','idle','printer','printing','job','jobs','web','mail','message','messages','proxy','compiler','interpreter','component','utility','administration','control','collector','filter','editor','handling','compare','rotation','mapping','tree','capabilities','parameters','parameter','analysis','reboot','same','different','difference','exists','exist','discover','discovered','retrieve','retrieving','gather','gathering','return','returned','open','closed','generated','generation','looks','fine','unsafe','suspicious','harmful','strict','enough','unsupported','implemented','implementation','assigned','maximum','minimum','currently','partial','full','argument','arguments','function','call','called','cleaning','interrupt','created','temporary','belongs','probably','likely','accessible','unclear','unique','expected','matching','distribution','removed','alert','denied','read-only','pointing','finally','seems','complicated','often','linked','continue','press','present','presence','consistency','responsive','selected','replace','deprecated','show','role','upload','logging','steps','ensure','received','without'
          }

          def mask(value):
            x=value
            for term in sorted(TECH_TERMS,key=len,reverse=True):x=re.sub(re.escape(term),' ',x,flags=re.I)
            x=re.sub(r'\$\{[^}]+\}|\$[A-Za-z_][A-Za-z0-9_]*|https?://\S+|ftp://\S+|/\S+|--\S+|\[[^]]+\]|\([^)]*[=/$][^)]*\)|"[^"\\]*(?:\\.[^"\\]*)*"', ' ',x)
            x=re.sub(r"'[^']*'|`[^`]*`",' ',x)
            return x

          def fields(line,spans):
            s=line.lstrip();selected=set()
            if not s or s.startswith('#'):return selected
            def after(flag,all_after=False):
              p=line.find(flag)
              if p<0:return
              ids=[i for i,m in enumerate(spans) if m.start()>p]
              if all_after:selected.update(ids)
              elif ids:selected.add(ids[0])
            if 'Register ' in line and '--description' in line:after('--description')
            if 'Display ' in line:
              after('--text');after('--result')
            for fn in ('DisplayError ','DisplayWarning ','DisplayException ','DisplayManual ','DisplayToolTip ','Fatal ','ExitFatal ','ReportManual '):
              if fn in line:after(fn,True)
            if 'LogText ' in line:after('LogText ')
            for fn in ('ReportWarning ','ReportSuggestion ','ReportException '):
              p=line.find(fn)
              if p>=0:
                ids=[i for i,m in enumerate(spans) if m.start()>p]
                if len(ids)>=2:selected.add(ids[1])
                for i in ids[2:]:
                  if spans[i].group(1).startswith(('text:','manual:','details:','solution:')):selected.add(i)
            if 'AddSetting ' in line:
              p=line.find('AddSetting ');ids=[i for i,m in enumerate(spans) if m.start()>p]
              if len(ids)>=3:selected.add(ids[2])
            if 'SKIPREASON=' in line:after('SKIPREASON=')
            direct=bool(re.match(r'^(?:if .*; then )?(?:echo|printf|\$\{ECHOCMD(?::-echo)?\}|\$\{ECHONB\})\b',s)) or '${ECHOCMD' in s or '${ECHONB}' in s
            if direct and not re.search(r'>\s*\$?\{?(?:LOGFILE|REPORTFILE|SETTINGS_FILE|TMPFILE)',line):selected.update(range(len(spans)))
            return selected

          def suspicious(value):
            body=value
            if body.startswith(('text:','manual:','details:','solution:')):body=body.split(':',1)[1]
            cleaned=mask(body)
            words=[w.lower() for w in WORD.findall(cleaned)]
            ordinary=[w for w in words if w in ORDINARY]
            if CJK.search(body):return bool(GRAMMAR.search(cleaned))
            return bool(GRAMMAR.search(cleaned)) or len(ordinary)>=2 or len(words)>=5

          files=[Path('lynis')]+sorted(p for p in Path('include').iterdir() if p.is_file())
          rows=[];counts=Counter()
          for path in files:
            try:lines=path.read_text(encoding='utf-8').splitlines()
            except UnicodeDecodeError:continue
            for n,line in enumerate(lines,1):
              spans=list(Q.finditer(line))
              for i in fields(line,spans):
                value=spans[i].group(1)
                if suspicious(value):
                  rows.append(f'{path}:{n}: {value}')
                  counts[str(path)]+=1

          out=['# Final comprehensive user-output audit',f'# Suspicious strings: {len(rows)}','', '# Counts by file']+[f'# {v:4d} {k}' for k,v in sorted(counts.items(),key=lambda x:(-x[1],x[0]))]+['',*rows,'']
          Path('FINAL_COMPREHENSIVE_OUTPUT_AUDIT.txt').write_text('\n'.join(out),encoding='utf-8')
          print('suspicious',len(rows))
          PY

      - name: Commit report and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/final-comprehensive-output-audit.yml
          git config user.name "AshFog Localization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add FINAL_COMPREHENSIVE_OUTPUT_AUDIT.txt .github/workflows/final-comprehensive-output-audit.yml
          git commit -m "chore: run final comprehensive output audit"
          git push origin HEAD:master
