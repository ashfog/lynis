name: One-time OS and networking output localization

on:
  push:
    branches: [master]
    paths: [.github/workflows/localize-os-network.yml]

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Translate user-visible OS and networking output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          allowed = (
              'LogText ', 'Display ', 'Register ', 'ReportWarning ',
              'ReportSuggestion ', 'ReportException ', 'SKIPREASON=', 'echo "'
          )

          mappings = {
              'include/osdetection': [
                  ('Unknown macOS version. Do you know what version it is? Create an issue at ${PROGRAM_SOURCE}', '未知的 macOS 版本。你知道这是哪个版本吗？请在 ${PROGRAM_SOURCE} 提交问题'),
                  ('Result: found TrueOS file, system is completely based on FreeBSD though. Only adjusting OS name.', '结果：发现 TrueOS 标识文件；该系统完全基于 FreeBSD，仅调整操作系统名称。'),
                  ('Result: The device is using Busybox.', '结果：该设备正在使用 BusyBox。'),
                  ('Result: The device is NOT using Busybox.', '结果：该设备未使用 BusyBox。'),
                  ('[ ${WARNING}WARNING${NORMAL} ]', '[ ${WARNING}警告${NORMAL} ]'),
                  ('${WARNING}Error${NORMAL}: ${WHITE}Unknown OS found. No support available yet for this OS or platform...${NORMAL}', '${WARNING}错误${NORMAL}：${WHITE}检测到未知操作系统，目前尚不支持此操作系统或平台……${NORMAL}'),
                  ('Please consult the README/documentation for more information.', '请查阅 README 或文档了解更多信息。'),
              ],
              'include/tool_tips': [
                  ('Tool tips: enabled', '工具提示：已启用'),
              ],
              'include/tests_networking': [
                  ('Hostname length and value check', '检查主机名长度和值'),
                  ('Result: FQDN is more than 253 characters', '结果：FQDN 超过 253 个字符'),
                  ('- Hostname (FQDN length)', '- 主机名（FQDN 长度）'),
                  ('Hostname is too long (more than 253 characters)', '主机名过长（超过 253 个字符）'),
                  ('Result: FQDN is not defined', '结果：未定义 FQDN'),
                  ('Result: FQDN is defined and not longer than 253 characters (${#FQDN} characters)', '结果：FQDN 已定义，且不超过 253 个字符（当前 ${#FQDN} 个字符）'),
                  ('Result: hostname is not defined', '结果：未定义主机名'),
                  ('Result: hostname is more than 63 characters', '结果：主机名超过 63 个字符'),
                  ('- Hostname (length)', '- 主机名（长度）'),
                  ('Result: hostnamed is defined and not longer than 63 characters', '结果：主机名已定义，且不超过 63 个字符'),
                  ('Result: good, no unexpected characters discovered in hostname', '结果：正常，主机名中未发现异常字符'),
                  ('- Hostname (allowed characters)', '- 主机名（允许的字符）'),
                  ('Result: unexpected characters discovered in hostname (characters: ${FIND}), which may impact network connectivity', '结果：主机名中发现异常字符（字符：${FIND}），可能影响网络连接'),
                  ('Hostname contains invalid characters', '主机名包含无效字符'),
                  ('text:See log file for invalid characters', 'text:请查看日志文件中的无效字符'),
                  ('Checking IPv6 configuration', '检查 IPv6 配置'),
                  ('Result: IPV6 mode is ${IPV6_MODE}', '结果：IPv6 模式为 ${IPV6_MODE}'),
                  ('- Checking IPv6 configuration', '- 检查 IPv6 配置'),
                  ('Configuration method', '配置方式'),
                  ('Result: IPv6 only configuration: ${STATUS}', '结果：仅 IPv6 配置：${STATUS}'),
                  ('IPv6 only', '仅 IPv6'),
                  ('Result: MTU of IPv6 interfaces should be 1280 or higher', '结果：IPv6 接口的 MTU 应为 1280 或更高'),
                  ('Error: MTU is too low', '错误：MTU 过低'),
                  ('Check your MTU configuration of IPv6 interfaces', '检查 IPv6 接口的 MTU 配置'),
                  ('Basic nameserver configuration tests', '基本名称服务器配置检查'),
                  ('- Checking configured nameservers', '- 检查已配置的名称服务器'),
                  ('Test: Checking /etc/resolv.conf file', '检查：检查 /etc/resolv.conf 文件'),
                  ('Result: Found /etc/resolv.conf file', '结果：发现 /etc/resolv.conf 文件'),
                  ('- Testing nameservers', '- 测试名称服务器'),
                  ('Test: Querying nameservers', '检查：查询名称服务器'),
                  ('Found nameserver: ${I}', '发现名称服务器：${I}'),
                  ('Nameserver: ${I}', '名称服务器：${I}'),
                  ('Nameserver ${I} seems to respond to queries from this host.', '名称服务器 ${I} 能够响应此主机的查询。'),
                  ('NO RESPONSE', '无响应'),
                  ('Result: nameserver ${I} does NOT respond', '结果：名称服务器 ${I} 未响应'),
                  ('Exit-code from dig: ${DNSRESPONSE}', 'dig 退出码：${DNSRESPONSE}'),
                  ('Check connection to this nameserver and make sure no outbound DNS queries are blocked (port 53 UDP and TCP).', '检查与该名称服务器的连接，并确认出站 DNS 查询未被阻止（UDP 和 TCP 端口 53）。'),
                  ('Nameserver ${I} does not respond', '名称服务器 ${I} 未响应'),
                  ("Result: Nameserver test for ${I} skipped, 'dig' not installed", '结果：未安装 dig，跳过名称服务器 ${I} 的测试'),
                  ('Check availability two nameservers', '检查是否有两个可用的名称服务器'),
                  ('- Minimal of 2 responsive nameservers', '- 至少两个可响应的名称服务器'),
                  ('Result: less than 2 responsive nameservers found', '结果：发现的可响应名称服务器少于两个'),
                  ("Couldn't find 2 responsive nameservers", '未找到两个可响应的名称服务器'),
                  ('Note: Non responsive nameservers can give problems for your system(s). Like the lack of recursive lookups, bad connectivity to update servers etc.', '说明：无响应的名称服务器可能导致系统出现问题，例如无法递归查询、无法连接更新服务器等。'),
                  ('Check your resolv.conf file and fill in a backup nameserver if possible', '检查 resolv.conf 文件，并在可能的情况下添加备用名称服务器'),
                  ('Result: found at least 2 responsive nameservers', '结果：至少发现两个可响应的名称服务器'),
                  ("Result: dig not installed, test can't be fully performed", '结果：未安装 dig，无法完整执行检查'),
                  ('Result: Test most likely skipped due having local resolver in /etc/resolv.conf', '结果：/etc/resolv.conf 中配置了本地解析器，因此可能跳过此检查'),
                  ('- DNSSEC supported (systemd-resolved)', '- DNSSEC 支持（systemd-resolved）'),
                  ('Result: DNSSEC supported by systemd-resolved and upstream DNS servers', '结果：systemd-resolved 和上游 DNS 服务器支持 DNSSEC'),
                  ('Result: DNSSEC not supported by systemd-resolved or upstream DNS servers', '结果：systemd-resolved 或上游 DNS 服务器不支持 DNSSEC'),
                  ("Result: command '${RESOLVE_CMD} ${RESOLVE_CMD_PARAM}' returned an error. Please run command manually to check for details.", "结果：命令 '${RESOLVE_CMD} ${RESOLVE_CMD_PARAM}' 返回错误，请手动运行命令查看详情。"),
                  ('Result: Test most likely skipped due to not having resolvectl', '结果：未找到 resolvectl，因此可能跳过此检查'),
                  ('Find default gateway (route)', '查找默认网关（路由）'),
                  ('Test: Searching default gateway(s)', '检查：搜索默认网关'),
                  ('Result: Found default gateway ${I}', '结果：发现默认网关 ${I}'),
                  ('- Checking default gateway', '- 检查默认网关'),
                  ('Result: No default gateway found', '结果：未找到默认网关'),
                  ('NONE FOUND', '未找到'),
                  ('Search for available network interfaces', '搜索可用的网络接口'),
                  ('No support for this OS (${OS}) to find available network interfaces', '此操作系统（${OS}）暂不支持查找可用网络接口'),
                  ('Found network interface: ${ITEM}', '发现网络接口：${ITEM}'),
                  ('No interfaces found on this system (OS=${OS})', '此系统上未发现网络接口（OS=${OS}）'),
                  ('Get network MAC addresses', '获取网络 MAC 地址'),
                  ('Test: Using ip binary to gather hardware addresses', '检查：使用 ip 命令收集硬件地址'),
                  ('Missing ifconfig or ip command to collect hardware address (MAC)', '缺少 ifconfig 或 ip 命令，无法收集硬件地址（MAC）'),
                  ('No support for this OS (${OS}) to find MAC information', '此操作系统（${OS}）暂不支持获取 MAC 信息'),
                  ('Found MAC address: ${ITEM}', '发现 MAC 地址：${ITEM}'),
                  ('Get network IP addresses', '获取网络 IP 地址'),
                  ('Test: Using ip binary to gather IP addresses', '检查：使用 ip 命令收集 IP 地址'),
                  ('Result: no support yet for this OS (${OS}) to find IP address information. You can help improving this test by submitting your details.', '结果：此操作系统（${OS}）暂不支持获取 IP 地址信息；你可以提交系统信息以帮助改进此检查。'),
                  ('IP address information test not implemented for this operating system', '尚未为此操作系统实现 IP 地址信息检查'),
                  ('Found IPv4 address: ${ITEM}', '发现 IPv4 地址：${ITEM}'),
                  ('Found IPv6 address: ${ITEM}', '发现 IPv6 地址：${ITEM}'),
                  ('Check listening ports', '检查监听端口'),
                  ('Test: Retrieving ss information to find listening ports', '检查：使用 ss 获取监听端口信息'),
                  ('Test: Retrieving netstat information to find listening ports', '检查：使用 netstat 获取监听端口信息'),
                  ('Test: Retrieving lsof information to find listening ports', '检查：使用 lsof 获取监听端口信息'),
                  ('Test: Retrieving sockstat information to find listening ports', '检查：使用 sockstat 获取监听端口信息'),
                  ('netstat and ss binary missing to gather listening ports', '缺少 netstat 和 ss 命令，无法收集监听端口'),
                  ('netstat missing to gather listening ports', '缺少 netstat 命令，无法收集监听端口'),
                  ('Unclear what method to use, to determine listening port information', '无法确定应使用哪种方法获取监听端口信息'),
                  ('Found listening info: ${ITEM}', '发现监听信息：${ITEM}'),
                  ('- Getting listening ports (TCP/UDP)', '- 获取监听端口（TCP/UDP）'),
                  ('Checking promiscuous interfaces (BSD)', '检查混杂模式接口（BSD）'),
                  ('Checking promiscuous interfaces (Linux)', '检查混杂模式接口（Linux）'),
                  ('Test: Checking promiscuous interfaces (FreeBSD)', '检查：检查混杂模式接口（FreeBSD）'),
                  ('Result: Promiscuous interfaces: ${FIND}', '结果：混杂模式接口：${FIND}'),
                  ('Result: this interface was whitelisted in profile (${PROFILE})', '结果：此接口已在配置文件中加入白名单（${PROFILE}）'),
                  ('Found promiscuous interface (${ITEM})', '发现混杂模式接口（${ITEM}）'),
                  ('Note: some tools put an interface into promiscuous mode, to capture/log network traffic', '说明：某些工具会将接口设为混杂模式，以捕获或记录网络流量'),
                  ('Result: Found promiscuous interface ${ITEM} (*whitelisted via profile*)', '结果：发现混杂模式接口 ${ITEM}（已通过配置文件加入白名单）'),
                  ('- Checking promiscuous interfaces', '- 检查混杂模式接口'),
                  ('Result: No promiscuous interfaces found', '结果：未发现混杂模式接口'),
                  ('Test: Using ip binary to retrieve network interfaces', '检查：使用 ip 命令获取网络接口'),
                  ('Test: Using ifconfig binary to retrieve network interfaces', '检查：使用 ifconfig 命令获取网络接口'),
                  ('Test: Checking all interfaces to discover any with promiscuous mode enabled', '检查：检查所有接口是否启用了混杂模式'),
                  ('Result: Promiscuous interface: ${I}', '结果：混杂模式接口：${I}'),
                  ('Found promiscuous interface', '发现混杂模式接口'),
                  ('text:Determine if this mode is required or whitelist interface in profile', 'text:确认是否需要此模式，或在配置文件中将接口加入白名单'),
                  ('Result: no network interfaces discovered, so nothing tested', '结果：未发现网络接口，因此未执行检查'),
                  ('Checking connections in WAIT state', '检查 WAIT 状态的连接'),
                  ('Test: Using netstat for check for connections in WAIT state', '检查：使用 netstat 检查 WAIT 状态的连接'),
                  ('Result: currently ${FIND} connections are in a waiting state (max configured: ${OPTIONS_CONN_MAX_WAIT_STATE}).', '结果：当前有 ${FIND} 个连接处于等待状态（配置的最大值：${OPTIONS_CONN_MAX_WAIT_STATE}）。'),
                  ('- Checking waiting connections', '- 检查等待状态的连接'),
                  ('Determine why system has many connections in WAIT state (${FIND})', '确定系统为何存在大量 WAIT 状态连接（${FIND}）'),
                  ('Result: ${FIND} connections are in WAIT state', '结果：有 ${FIND} 个连接处于 WAIT 状态'),
                  ('Checking DHCP client status', '检查 DHCP 客户端状态'),
                  ('- Checking status DHCP client', '- 检查 DHCP 客户端状态'),
                  ('Checking for ARP monitoring software', '检查 ARP 监控软件'),
                  ('- Checking for ARP monitoring software', '- 检查 ARP 监控软件'),
                  ('Determine available network protocols', '确定可用的网络协议'),
                  ('Test: checking the status of some network protocols that typically are not used', '检查：检查一些通常不使用的网络协议状态'),
                  ("Test: now checking module '${P}'", "检查：正在检查模块 '${P}'"),
                  ('Result: found ${P} module disabled via modprobe.conf', '结果：发现 ${P} 模块已通过 modprobe.conf 禁用'),
                  ('Result: found ${P} module disabled via ${F}', '结果：发现 ${P} 模块已通过 ${F} 禁用'),
                  ("Determine if protocol '${P}' is really needed on this system", "确认此系统是否确实需要协议 '${P}'"),
                  ('This test has no routine yet for this operating system.', '此操作系统尚无对应的检查方法。'),
                  ('- Uncommon network protocols', '- 非常用网络协议'),
              ],
          }

          changed_files = []
          total_replacements = 0
          for filename, pairs in mappings.items():
              path = Path(filename)
              original_lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              new_lines = []
              file_replacements = 0
              for line in original_lines:
                  new = line
                  if any(marker in line for marker in allowed):
                      for old, replacement in pairs:
                          count = new.count(old)
                          if count:
                              new = new.replace(old, replacement)
                              file_replacements += count
                  new_lines.append(new)

              for old_line, new_line in zip(original_lines, new_lines):
                  if old_line != new_line and not any(marker in old_line for marker in allowed):
                      raise SystemExit(f'非用户可见行发生变化: {filename}: {old_line.rstrip()}')

              if file_replacements:
                  path.write_text(''.join(new_lines), encoding='utf-8')
                  changed_files.append(filename)
                  total_replacements += file_replacements
                  print(f'{filename}: {file_replacements} replacements')

          if total_replacements < 100:
              raise SystemExit(f'替换数量异常偏低: {total_replacements}')
          print(f'total replacements: {total_replacements}')
          PY

          sh -n include/osdetection
          sh -n include/tool_tips
          sh -n include/tests_networking

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/osdetection include/tool_tips include/tests_networking
          git commit -m "i18n: translate OS detection and networking output"
          git rm .github/workflows/localize-os-network.yml
          git commit -m "chore: remove one-time OS networking workflow"
          git push origin master
