              ('Test: Checking which files are rotated with logrotate and if they exist', '检查：确认哪些文件由 logrotate 轮转以及它们是否存在'),
              ('Result: nothing found', '结果：未发现相关内容'),
              ('Result: found one or more files which are rotated via logrotate', '结果：发现一个或多个由 logrotate 轮转的文件'),
              ('Output: ${I}', '输出：${I}'),
              ('Checking directories in logrotate configuration', '检查 logrotate 配置中的目录'),
              ('Test: Checking which directories can be found in logrotate configuration', '检查：搜索 logrotate 配置中定义的目录'),
              ('Result: found one or more directories (via logrotate configuration)', '结果：通过 logrotate 配置发现一个或多个目录'),
              ('Directory found: ${DIR}', '发现目录：${DIR}'),
              ('Result: Directory could not be found: ${DIR}', '结果：找不到目录 ${DIR}'),
              ('Checking loghost', '检查 loghost'),
              ('Result: Checking for loghost in /etc/inet/hosts', '检查：在 /etc/inet/hosts 中搜索 loghost'),
              ('Result: Found loghost entry in /etc/inet/hosts', '结果：在 /etc/inet/hosts 中发现 loghost 条目'),
              ('Result: No loghost entry found in /etc/inet/hosts', '结果：/etc/inet/hosts 中未发现 loghost 条目'),
              ('Result: Checking for loghost via name resolving', '检查：通过名称解析搜索 loghost'),
              ('Result: name resolving was successful', '结果：名称解析成功'),
              ("Result: name resolving didn't find results", '结果：名称解析未返回结果'),
              ('Result: loghost entry found and most likely used to send syslog messages', '结果：发现 loghost 条目，可能用于发送 syslog 消息'),
              ('- Checking loghost entry', '- 检查 loghost 条目'),
              ('Result: No loghost entry found', '结果：未发现 loghost 条目'),
              ('No loghost entry found', '未发现 loghost 条目'),
              ('Add a loghost entry to /etc/inet/hosts or other name services', '在 /etc/inet/hosts 或其他名称服务中添加 loghost 条目'),
              ('Checking loghost is localhost', '检查 loghost 是否为 localhost'),
              ('Result: loghost entry is localhost (default)', '结果：loghost 条目为 localhost（默认值）'),
              ('- Checking loghost entry is localhost', '- 检查 loghost 条目是否为 localhost'),
              ('Set loghost entry to a remote location to enable remote logging.', '将 loghost 条目设置为远程位置以启用远程日志。'),
              ('Checking syslog configuration file', '检查 syslog 配置文件'),
              ('Test: analyzing file ${TARGET} for remote target', '检查：分析文件 ${TARGET} 中的远程目标'),
              ('Test: analyzing file ${F} for remote target', '检查：分析文件 ${F} 中的远程目标'),
              ('Result: no remote target found', '结果：未发现远程目标'),
              ('Result: found remote target', '结果：发现远程目标'),
              ('Data: ${D}', '数据：${D}'),
              ("Result: most likely remote log host is used, as keyword 'target' is used", "结果：发现 'target' 关键字，很可能正在使用远程日志主机"),
              ('Test: check if logs are also logged to a remote logging host', '检查：确认日志是否同时发送到远程日志主机'),
              ('Result: remote logging enabled to loghost, but loghost is localhost', '结果：已向 loghost 启用远程日志，但 loghost 指向 localhost'),
              ('Result: remote logging enabled', '结果：已启用远程日志'),
              ('Result: found destination ${DESTINATION} configured for remote logging', '结果：发现用于远程日志的目标 ${DESTINATION}'),
              ('Test: Checking Wazuh agent configuration for remote syslog forwarding', '检查：检查 Wazuh Agent 的远程 syslog 转发配置'),
              ('Result: found destination ${DESTINATION} configured for remote logging with wazuh', '结果：Wazuh 配置了远程日志目标 ${DESTINATION}'),
              ('Result: no remote logging found', '结果：未发现远程日志配置'),
              ('Enable logging to an external logging host for archiving purposes and additional protection', '启用外部日志主机，用于归档并提供额外保护'),
              ('- Checking remote logging', '- 检查远程日志'),
              ('Checking /etc/newsyslog.conf', '检查 /etc/newsyslog.conf'),
              ('Result: ${ROOTDIR}etc/newsyslog.conf found', '结果：发现 ${ROOTDIR}etc/newsyslog.conf'),
              ('- Checking ${ROOTDIR}etc/newsyslog.conf', '- 检查 ${ROOTDIR}etc/newsyslog.conf'),
              ('Checking directories in /etc/newsyslog.conf', '检查 /etc/newsyslog.conf 中的目录'),
              ('Test: parsing directories from /etc/newsyslog.conf file', '检查：解析 /etc/newsyslog.conf 中的目录'),
              ('Result: Directory ${I} found and exists', '结果：目录 ${I} 存在'),
              ('Result: Item ${I} is not a directory', '结果：${I} 不是目录'),
              ('- Checking log directories (newsyslog.conf)', '- 检查日志目录（newsyslog.conf）'),
              ('Checking files specified /etc/newsyslog.conf', '检查 /etc/newsyslog.conf 中指定的文件'),
              ('Test: parsing files from ${ROOTDIR}etc/newsyslog.conf file', '检查：解析 ${ROOTDIR}etc/newsyslog.conf 中的文件'),
              ('Result: File ${I} found and exists', '结果：文件 ${I} 存在'),
              ('Result: Item ${I} is not a file', '结果：${I} 不是文件'),
              ('- Checking log files (newsyslog.conf)', '- 检查日志文件（newsyslog.conf）'),
              ('Checking log paths', '检查日志路径'),
              ('Test: Searching log paths', '检查：搜索日志路径'),
              ('Result: directory ${I} exists', '结果：目录 ${I} 存在'),
              ("Result: directory ${I} can't be found", '结果：找不到目录 ${I}'),
              ('- Checking log directories (static list)', '- 检查日志目录（静态列表）'),
              ('Checking open log files', '检查已打开的日志文件'),
              ('Test: checking open log files with lsof', '检查：使用 lsof 检查已打开的日志文件'),
              ('Found logfile: ${I}', '发现日志文件：${I}'),
              ('- Checking open log files', '- 检查已打开的日志文件'),
              ('Result: lsof not installed, skipping test', '结果：未安装 lsof，跳过检查'),
              ('Checking for deleted files in use', '检查仍在使用的已删除文件'),
              ('Test: checking deleted files that are still in use', '检查：检查仍在使用的已删除文件'),
              ('Result: found one or more files which are deleted, but still in use', '结果：发现一个或多个已删除但仍在使用的文件'),
              ('Found deleted file: ${I}', '发现仍在使用的已删除文件：${I}'),
              ('- Checking deleted files in use', '- 检查仍在使用的已删除文件'),
              ('Check what deleted files are still in use and why.', '检查哪些已删除文件仍在使用以及原因。'),
              ('Result: no deleted files found', '结果：未发现仍在使用的已删除文件'),
              ('Checking for open log files that are empty', '检查已打开但为空的日志文件'),
              ('Found an opened logfile that is empty: ${I}', '发现已打开但为空的日志文件：${I}'),
              ('Result: all opened log files are bigger than zero bytes in size', '结果：所有已打开的日志文件大小均大于 0 字节'),
          ]

          required = ['Check for running syslog daemon', 'Checking logrotate.conf and logrotate.d', 'Checking syslog configuration file']
          for marker in required:
              if marker not in original:
                  raise SystemExit(f'missing required marker: {marker}')

          changed = 0
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
                  changed += 1

          if changed < 110:
              raise SystemExit(f'too few replacements applied: {changed}')

          path.write_text(text, encoding='utf-8')
          print(f'applied {changed} logging translations')
          PY

          sh -n include/tests_logging

      - name: Commit localized logging checks and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/localize-logging.yml
          git config user.name "AshFog Localization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add include/tests_logging .github/workflows/localize-logging.yml
          git commit -m "i18n: translate logging and rotation checks"
          git push origin HEAD:master
