              ('Result: Syslog-NG configuration file seems NOT to be consistent', '结果：Syslog-NG 配置文件可能存在不一致'),
              ('- Checking Syslog-NG consistency', '- 检查 Syslog-NG 一致性'),
              ('Check the Syslog-NG configuration file and/or run a manual consistency check with: syslog-ng -s', '检查 Syslog-NG 配置文件，或手动运行 syslog-ng -s 验证一致性'),
