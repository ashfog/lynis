name: One-time logging localization

on:
  push:
    branches: [master]
    paths: [.github/workflows/localize-logging.yml]

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Translate logging checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('include/tests_logging')
          text = path.read_text(encoding='utf-8')
          original = text
          replacements = [
              ('Check for running syslog daemon', '检查正在运行的 syslog 守护进程'),
              ('Test: Searching for a logging daemon', '检查：搜索日志守护进程'),
