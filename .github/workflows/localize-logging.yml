              ('Checking wazuh-agent', '检查 wazuh-agent'),
              ('Result: Searching for wazuh-agent instances in the process list', '检查：在进程列表中搜索 wazuh-agent 实例'),
              ('Result: Found wazuh-agent in process list', '结果：在进程列表中发现 wazuh-agent'),
              ('Result: wazuh-agent NOT found in process list', '结果：进程列表中未发现 wazuh-agent'),
              ('- Checking wazuh-agent status', '- 检查 wazuh-agent 状态'),
              ('- Checking wazuh-agent daemon status', '- 检查 wazuh-agent 守护进程状态'),
              ('Checking logrotate.conf and logrotate.d', '检查 logrotate.conf 和 logrotate.d'),
              ('Test: Checking for ${ROOTDIR}etc/logrotate.conf', '检查：确认 ${ROOTDIR}etc/logrotate.conf 是否存在'),
              ('Result: ${ROOTDIR}etc/logrotate.conf found (file)', '结果：发现文件 ${ROOTDIR}etc/logrotate.conf'),
              ('Result: ${ROOTDIR}etc/logrotate.conf NOT found', '结果：未找到 ${ROOTDIR}etc/logrotate.conf'),
              ('Test: Checking for ${ROOTDIR}etc/logrotate.d (directory)', '检查：确认目录 ${ROOTDIR}etc/logrotate.d 是否存在'),
              ('Result: ${ROOTDIR}etc/logrotate.d found', '结果：发现 ${ROOTDIR}etc/logrotate.d'),
              ('Result: ${ROOTDIR}etc/logrotate.conf found', '结果：发现 ${ROOTDIR}etc/logrotate.conf'),
