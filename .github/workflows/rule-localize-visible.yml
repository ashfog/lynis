            'Linux','FreeBSD','OpenBSD','NetBSD','DragonFly','Solaris','AIX','macOS','BSD','UNIX','Unix','Lynis','systemd','syslog','rsyslog','syslog-ng','journald','nginx','Apache','Postfix','Exim','PHP','SSH','SSL','TLS','NTP','DNS','DNSSEC','IPv4','IPv6','TCP','UDP','PAM','RPM','APT','apt','dpkg','YUM','yum','DNF','dnf','pacman','apk','pkg','Docker','Podman','KVM','Xen','LXC','MySQL','MariaDB','PostgreSQL','Redis','MongoDB','Oracle','DB2','Squid','SNMP','NFS','USB','UEFI','GRUB','LILO','SELinux','AppArmor','iptables','nftables','OpenSSL','CVE','UID','GID','FQDN','MTU','ARP','DHCP','LDAP','NIS','Cron','cron','sudo','doas','BusyBox','Wazuh','auditd','chrony','OpenNTPD','timesyncd','HostID','HOSTID','MAC','PATH','API','URL','GitHub','CISOfy','ClamAV','BIND','CUPS','TraceEnable','VM','EC2','AWS','GCP','Azure','SCTP','DCCP','RDS','TIPC','OOM','ACL','I/O','IO','LSM','LUKS','GPG','GLSA','PID','EOL','TXT','SDK','CLI','IDS','AV','CSF','OSSEC','LMD','LVM','RPC','TAR','DEB','VMWare','SaltStack','OpenSMTPD','Grsecurity','TOMOYO','tomoyo','IMA','EVM','krb5','nftables','openntpd','launchd','upstart'
          }

          def mask(text):
            saved=[]
            patterns=[r'\$\{[^}]+\}',r'\$[A-Za-z_][A-Za-z0-9_]*',r'\$\([^)]*\)',r'https?://\S+',r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}',r'(?<!\w)/(?:[^\s,;:()\[\]{}]+/?)+',r'--[A-Za-z0-9_-]+(?:=[^\s]+)?',r"'[^']*'",r'`[^`]*`',r'%[-+0-9.]*[sdifouxXeEgGc]',r'\\[ntr]',r'\b[A-Z][A-Z0-9_/-]{1,}\b',r'\b[A-Za-z0-9_]+(?:\.[A-Za-z0-9_*?-]+)+\b',r'\b[A-Za-z0-9_]+(?:-[A-Za-z0-9_]+)+\b']
            rx=re.compile('|'.join(f'(?:{p})' for p in patterns))
            def sub(m):
              k=f'ZZZPH{len(saved)}ZZZ'; saved.append(m.group(0)); return k
            text=rx.sub(sub,text)
            terms=sorted(protected,key=len,reverse=True)
            trx=re.compile(r'(?<![A-Za-z0-9_])(?:'+'|'.join(re.escape(x) for x in terms)+r')(?![A-Za-z0-9_])')
            def tsub(m):
              k=f'ZZZPH{len(saved)}ZZZ'; saved.append(m.group(0)); return k
            return trx.sub(tsub,text),saved

          def unmask(text,saved):
            for i,v in enumerate(saved): text=text.replace(f'ZZZPH{i}ZZZ',v)
            return text

          def trans_desc(d):
            x=d
            for a,b in sorted(phrases,key=lambda z:len(z[0]),reverse=True): x=x.replace(a,b)
            m,s=mask(x)
            def repl(mm):
              w=mm.group(0); return words.get(w.lower(),w)
            m=re.sub(r"[A-Za-z][A-Za-z'-]*",repl,m)
            return unmask(m,s).strip()

          def translate(text):
            if text in exact: return exact[text]
            original=text
            # Standardize known binary discovery lines while preserving binary names.
            m=re.match(r'^(\s*)Found known binary:?\s+(.+?)(?:\s+\((.*?)\))?\s+-\s+(.+)$',text)
            if m:
              indent,name,desc,path=m.groups()
              return f'{indent}发现已知程序：{name}' + (f'（{trans_desc(desc)}）' if desc else '') + f' - {path}'
            m=re.match(r'^(\s*)Found (known binary:?\s+)?(.+?)\s+\(version:?\s*(.+)\)$',text)
            if m:
              indent,known,name,ver=m.groups(); return f'{indent}发现' + ('已知程序：' if known else ' ') + f'{name}（版本 {ver}）'
            x=text
            for a,b in sorted(phrases,key=lambda z:len(z[0]),reverse=True): x=x.replace(a,b)
            masked,saved=mask(x)
            def repl(mm):
              w=mm.group(0)
              return words.get(w.lower(),w)
            masked=re.sub(r"[A-Za-z][A-Za-z'-]*",repl,masked)
            x=unmask(masked,saved)
            x=re.sub(r'\s+([，。；：！？）])',r'\1',x)
            x=re.sub(r'([（])\s+',r'\1',x)
            x=x.replace(':', '：') if re.match(r'^[^$/:]{1,40}:',x) else x
            x=re.sub(r' {2,}',' ',x)
            return x

          def indexes(line,spans):
            s=line.lstrip(); out=set()
            if not s or s.startswith('#'): return out
            if 'Register ' in line and '--description' in line:
              p=line.find('--description')
              for i,m in enumerate(spans):
                if m.start()>p: out.add(i); break
            if 'Display ' in line:
              for flag in ('--text','--result'):
                p=line.find(flag)
                if p>=0:
                  for i,m in enumerate(spans):
                    if m.start()>p: out.add(i); break
            if any(x in line for x in ('DisplayError ','DisplayWarning ','DisplaySuggestion ')) and spans: out.add(0)
            if 'LogText ' in line:
              p=line.find('LogText ')
              for i,m in enumerate(spans):
                if m.start()>p: out.add(i); break
            for fn in ('ReportWarning ','ReportSuggestion ','ReportException '):
              p=line.find(fn)
              if p>=0:
                arr=[i for i,m in enumerate(spans) if m.start()>p]
                out.update(arr[1:])
            if 'SKIPREASON=' in line:
              p=line.find('SKIPREASON=')
              for i,m in enumerate(spans):
                if m.start()>p: out.add(i); break
            if s.startswith(('echo ','printf ')) or re.match(r'^(?:if .*; then )?(?:echo|printf) ',s):
              if not re.search(r'>\s*\$?\{?(?:LOGFILE|REPORTFILE|SETTINGS_FILE|TMPFILE)',line): out.update(range(len(spans)))
            return out

          files=[Path('lynis')]+sorted(p for p in Path('include').iterdir() if p.is_file())
          changed=[]; n=0
          for path in files:
            try: original=path.read_text(encoding='utf-8')
            except UnicodeDecodeError: continue
            lines=original.splitlines(keepends=True); new=[]; fc=0
            for line in lines:
              spans=list(qre.finditer(line)); ids=indexes(line,spans)
              if not ids: new.append(line); continue
              parts=[]; last=0
              for i,m in enumerate(spans):
                parts.append(line[last:m.start(1)]); value=m.group(1)
                if i in ids and re.search(r'[A-Za-z]{2,}',value):
                  nv=translate(value)
                  if nv!=value: value=nv.replace('"','\\"'); fc+=1
                parts.append(value); last=m.end(1)
              parts.append(line[last:]); new.append(''.join(parts))
            updated=''.join(new)
            if updated!=original:
              path.write_text(updated,encoding='utf-8'); changed.append(str(path)); n+=fc; print(path,fc)
          if n<500: raise SystemExit(f'too few strings localized: {n}')
          Path('/tmp/rule-localized-files').write_text('\n'.join(changed),encoding='utf-8')
          print('localized strings',n,'files',len(changed))
          PY
          while IFS= read -r file; do
            [ -n "$file" ] && sh -n "$file"
          done < /tmp/rule-localized-files
      - name: Commit localization and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/rule-localize-visible.yml
          git config user.name "AshFog Localization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lynis include .github/workflows/rule-localize-visible.yml
          git commit -m "i18n: localize all remaining visible strings"
          git push origin HEAD:master
