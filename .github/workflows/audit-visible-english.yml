name: One-time visible English audit

on:
  push:
    branches: [master]
    paths: [.github/workflows/audit-visible-english.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Scan active user-visible strings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('lynis'), Path('include')]
          candidates = []
          visible_markers = (
              'Register ', 'Display ', 'LogText ', 'ReportWarning ',
              'ReportSuggestion ', 'ReportException ', 'SKIPREASON=',
              'DisplayError ', 'DisplayWarning ', 'DisplaySuggestion ',
              'echo ', 'printf '
          )
          english_markers = re.compile(
              r'\b(Result|Test|Checking|Check|Searching|Search|Found|Finding|Querying|Query|'
              r'Could|Unable|Unknown|Please|Warning|Error|Note|Risk|Information|Output|'
              r'Install|Enable|Disable|Determine|Review|Consider|Missing|Skipped|Skipping|'
              r'Running|Not running|Not found|No |Yes|Using|Retrieving|Gathering|Validate|'
              r'Verify|Status|Available|Configured|Configuration|File|Directory|Service|'
              r'Process|Package|Software|System|User|Group|Password|Network|Protocol|Port|'
              r'Listening|Remote|Local|Security|Audit|Support|Detected|Active|Inactive)\b',
              re.I,
          )
          cjk = re.compile(r'[\u3400-\u9fff]')
          technical_only = re.compile(
              r'^[\s\-:()\[\]{}$_.=/+0-9A-Z]+(?:systemd|syslog|rsyslog|nginx|apache|'
              r'php|ssh|ssl|tls|ntp|dns|ipv4|ipv6|tcp|udp|pam|rpm|apt|dpkg|yum|dnf|'
              r'pacman|apk|pkg|docker|podman|kvm|xen|lxc|mysql|mariadb|postgresql|'
              r'redis|mongodb|oracle|db2|squid|snmp|nfs|usb|uefi|grub|lilo|selinux|'
              r'apparmor|firewall|iptables|nftables|pf|ipfw|kernel|linux|freebsd|openbsd|'
              r'netbsd|solaris|aix|macos|bsd|cve|uid|gid|fqdn|mtu|arp|dhcp|ldap|nis|'
              r'cron|sudo|doas|busybox|wazuh|auditd|chrony|openntpd|timesyncd)*[\s\-:()\[\]{}$_.=/+0-9A-Z]*$',
              re.I,
          )

          files = []
          if roots[0].is_file(): files.append(roots[0])
          if roots[1].is_dir():
              files.extend(sorted(p for p in roots[1].rglob('*') if p.is_file()))

          for path in files:
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except UnicodeDecodeError:
                  continue
              for lineno, raw in enumerate(lines, 1):
                  stripped = raw.lstrip()
                  if not stripped or stripped.startswith('#'):
                      continue
                  if not any(marker in raw for marker in visible_markers):
                      continue
                  quoted = ' '.join(re.findall(r'"([^"\\]*(?:\\.[^"\\]*)*)"', raw))
                  if not quoted:
                      quoted = raw
                  if technical_only.fullmatch(quoted.strip()):
                      continue
                  has_cjk = bool(cjk.search(quoted))
                  suspicious = bool(english_markers.search(quoted))
                  if (not has_cjk and re.search(r'[A-Za-z]{3,}', quoted)) or suspicious:
                      candidates.append(f'{path}:{lineno}: {raw}')

          report = [
              '# Remaining active user-visible English candidates',
              f'# Count: {len(candidates)}',
              '# Generated automatically; comments and Debug-only lines are excluded.',
              '',
              *candidates,
              '',
          ]
          Path('VISIBLE_ENGLISH_REPORT.txt').write_text('\n'.join(report), encoding='utf-8')
          print(f'found {len(candidates)} candidates')
          PY
      - name: Commit report and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/audit-visible-english.yml
          git config user.name "AshFog Localization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add VISIBLE_ENGLISH_REPORT.txt .github/workflows/audit-visible-english.yml
          git commit -m "chore: report remaining visible English"
          git push origin HEAD:master
