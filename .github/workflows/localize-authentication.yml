name: One-time authentication localization

on:
  push:
    branches: [master]
    paths: [.github/workflows/localize-authentication.yml]

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Translate authentication account and group checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('include/tests_authentication')
          text = path.read_text(encoding='utf-8')
          original = text

          replacements = [
              ('Check users with an UID of zero', '检查 UID 为 0 的用户'),
              ('Test: Searching accounts with UID 0', '检查：搜索 UID 为 0 的账户'),
              ('- Administrator accounts', '- 管理员账户'),
              ('Result: Found more than one administrator accounts', '结果：发现多个管理员账户'),
              ('Multiple users with UID 0 found in passwd file', 'passwd 文件中发现多个 UID 为 0 的用户'),
              ('Administrator account: ${USER}', '管理员账户：${USER}'),
              ("BSD note: default there is a user 'toor' installed. This account is considered useless unless it", "BSD 说明：系统默认安装了用户 'toor'。除非为其设置密码并用于"),
              ('is assigned a password and used for daily operations or emergencies. ie: bad shell for root user.', '日常操作或紧急情况，否则通常无需保留，例如 root 用户的 Shell 配置异常。'),
              ("Use vipw to delete the 'toor' user if not used.", "如未使用，请通过 vipw 删除 'toor' 用户。"),
              ('Result: No accounts found with UID 0 other than root.', '结果：除 root 外未发现其他 UID 为 0 的账户。'),
              ('Check non-unique accounts in passwd file', '检查 passwd 文件中的重复账户'),
              ('Test: Checking for non-unique accounts', '检查：查找重复账户'),
              ('- Unique UIDs', '- UID 唯一性'),
              ('Result: all accounts found in ${PASSWD_FILE} are unique', '结果：${PASSWD_FILE} 中的所有账户 UID 均唯一'),
              ('Result: found multiple accounts with same UID', '结果：发现多个账户使用相同 UID'),
              ('Output (non-unique UIDs): ${FIND}', '输出（重复 UID）：${FIND}'),
              ('Multiple accounts found with same UID', '发现多个账户使用相同 UID'),
              ('Result: test skipped, ${PASSWD_FILE} file not available', '结果：${PASSWD_FILE} 文件不可用，跳过检查'),
              ('Remarks: Non unique UIDs can be a risk for the system or part of a configuration mistake', '说明：重复 UID 可能带来系统风险，也可能是配置错误'),
              ('Prerequisite test: /usr/sbin/chkgrp', '前置检查：/usr/sbin/chkgrp'),
              ('Test group file', '检查组文件'),
              ('- Checking chkgrp tool', '- 检查 chkgrp 工具'),
              ('Result: /usr/sbin/chkgrp binary found. Using this to perform next test(s).', '结果：发现 /usr/sbin/chkgrp，将用它执行后续检查。'),
              ('Test: Testing consistency of /etc/group file', '检查：验证 /etc/group 文件一致性'),
              ('- Checking consistency of /etc/group file', '- 检查 /etc/group 文件一致性'),
              ('Result: chkgrp test performed, Group file seems to be ok.', '结果：chkgrp 检查完成，组文件看起来正常。'),
              ('Result: chkgrp found some errors. Run the tool manually to see details.', '结果：chkgrp 发现错误，请手动运行该工具查看详情。'),
              ('chkgrp output: ${FIND}', 'chkgrp 输出：${FIND}'),
              ('chkgrp reported inconsistencies in /etc/group file', 'chkgrp 报告 /etc/group 文件存在不一致'),
              ('Check group and shadow group files', '检查 group 和 shadow group 文件'),
              ('Test: Checking for grpck binary output', '检查：分析 grpck 输出'),
              ('- Consistency of group files (grpck)', '- 组文件一致性（grpck）'),
              ("Result: grpck binary didn't find any errors in the group files", '结果：grpck 未在组文件中发现错误'),
              ('grpck binary found errors in one or more group files', 'grpck 在一个或多个组文件中发现错误'),
              ('Check login shells for passwordless accounts', '检查无密码账户的登录 Shell'),
              ('Test: Checking login shells', '检查：检查登录 Shell'),
              ('- Login shells', '- 登录 Shell'),
              ('Output: ${LINE}', '输出：${LINE}'),
              ('Result: found no shell on line', '结果：该行未发现 Shell'),
              ('Result: found possible harmful shell ${SHELL}', '结果：发现可能存在风险的 Shell ${SHELL}'),
              ('Result: shell ${SHELL} does exist', '结果：Shell ${SHELL} 存在'),
              ('Result: shell ${SHELL} does not exist', '结果：Shell ${SHELL} 不存在'),
              ('Determine if account is needed, as shell ${SHELL} does not exist', '确认该账户是否仍有必要保留，因为 Shell ${SHELL} 不存在'),
