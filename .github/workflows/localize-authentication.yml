              ('Check unique groups (IDs)', '检查组 ID 唯一性'),
              ("Test: Checking for non unique group ID's in /etc/group", '检查：查找 /etc/group 中重复的组 ID'),
              ('- Unique group IDs', '- 组 ID 唯一性'),
              ("Result: All group ID's are unique", '结果：所有组 ID 均唯一'),
              ('Result: Found the same group ID multiple times', '结果：同一组 ID 出现多次'),
              ('Non-unique group: ${I}', '重复组：${I}'),
              ('Check your /etc/group file and correct any inconsistencies', '检查 /etc/group 文件并修正所有不一致'),
              ('Check unique group names', '检查组名唯一性'),
              ('Test: Checking for non unique group names in ${ROOTDIR}etc/group', '检查：查找 ${ROOTDIR}etc/group 中重复的组名'),
              ('- Unique group names', '- 组名唯一性'),
              ('Result: All group names are unique', '结果：所有组名均唯一'),
              ('Result: Found the same group name multiple times', '结果：同一组名出现多次'),
              ('Check your ${ROOTDIR}etc/group file and correct any inconsistencies', '检查 ${ROOTDIR}etc/group 文件并修正所有不一致'),
              ('Check password file consistency with pwck', '使用 pwck 检查密码文件一致性'),
              ('Test: Checking password file consistency (pwck)', '检查：使用 pwck 检查密码文件一致性'),
              ('Dev: found ${ROOTDIR}usr/sbin/pwck, but unsure how to call it on this operating system', '开发信息：发现 ${ROOTDIR}usr/sbin/pwck，但不确定在此操作系统上的调用方式'),
              ('Found ${ROOTDIR}usr/sbin/pwck, but unsure how to call it on this operating system', '发现 ${ROOTDIR}usr/sbin/pwck，但不确定在此操作系统上的调用方式'),
              ('- Password file consistency', '- 密码文件一致性'),
              ("Result: pwck check didn't find any problems", '结果：pwck 未发现问题'),
              ('Result: pwck found one or more errors/warnings in the password file.', '结果：pwck 在密码文件中发现一个或多个错误或警告。'),
              ('Run pwck manually and correct any errors in the password file', '手动运行 pwck 并修正密码文件中的错误'),
              ('Unknown password hashing method ${METHOD}. Please report to lynis-dev@cisofy.com', '未知密码散列方法 ${METHOD}，请报告至 lynis-dev@cisofy.com'),
              ('Check password hashing methods', '检查密码散列方法'),
              ('Test: Checking password hashing methods', '检查：检查密码散列方法'),
              ('- Password hashing methods', '- 密码散列方法'),
              ('Result: no poor password hashing methods found', '结果：未发现较弱的密码散列方法'),
              ('Result: poor password hashing methods found: ${FIND}', '结果：发现较弱的密码散列方法：${FIND}'),
              ('Check PAM configuration, add rounds if applicable and expire passwords to encrypt with new values', '检查 PAM 配置；适用时增加散列轮数，并使旧密码过期以使用新参数重新加密'),
              ('Check password hashing rounds', '检查密码散列轮数'),
              ('Test: Checking SHA_CRYPT_{MIN,MAX}_ROUNDS option in ${ROOTDIR}etc/login.defs', '检查：${ROOTDIR}etc/login.defs 中的 SHA_CRYPT_{MIN,MAX}_ROUNDS 选项'),
              ('Result: number of password hashing rounds is not configured', '结果：未配置密码散列轮数'),
              ('- Checking password hashing rounds', '- 检查密码散列轮数'),
              ('Configure password hashing rounds in /etc/login.defs', '在 /etc/login.defs 中配置密码散列轮数'),
              ('Result: low number of password hashing rounds found: ${SHA_CRYPT_ROUNDS}', '结果：密码散列轮数过低：${SHA_CRYPT_ROUNDS}'),
              ('- Password hashing rounds (minimum)', '- 密码散列轮数（最小值）'),
              ('Result: number of password hashing rounds is ${SHA_CRYPT_ROUNDS}', '结果：密码散列轮数为 ${SHA_CRYPT_ROUNDS}'),
              ('Query user accounts', '查询用户账户'),
              ('Test: Read system users (including root user) from password database (e.g. /etc/passwd)', '检查：从密码数据库（例如 /etc/passwd）读取系统用户，包括 root'),
              ('AIX real users output (ID = 0, or 100+):', 'AIX 真实用户输出（ID 为 0 或不小于 100）：'),
              ('FreeBSD real users output (ID = 0, or 1000+, but not 65534):', 'FreeBSD 真实用户输出（ID 为 0 或不小于 1000，但不包括 65534）：'),
              ('Result: found minimal user id specified: ${UID_MIN}', '结果：发现配置的最小用户 ID：${UID_MIN}'),
              ('Linux real users output (ID = 0, or ${UID_MIN}+, but not 65534):', 'Linux 真实用户输出（ID 为 0 或不小于 ${UID_MIN}，但不包括 65534）：'),
              ('macOS real users output (ID = 0, or 500-599) using dscacheutil', '使用 dscacheutil 获取 macOS 真实用户（ID 为 0 或 500–599）'),
              ('Result: found configured user id range specified: ${UID_RANGE}', '结果：发现配置的用户 ID 范围：${UID_RANGE}'),
              ('Result: no configured user id range specified; using default ${UID_MIN}-${UID_MAX}', '结果：未配置用户 ID 范围，使用默认值 ${UID_MIN}-${UID_MAX}'),
              ('${OS} real users output (ID = 0, or ${UID_MIN}-${UID_MAX}, but not 32767):', '${OS} 真实用户输出（ID 为 0 或 ${UID_MIN}-${UID_MAX}，但不包括 32767）：'),
              ('Solaris real users output (ID =0, or 100+, but not 60001/65534):', 'Solaris 真实用户输出（ID 为 0 或不小于 100，但不包括 60001/65534）：'),
              ('Can not determine user accounts', '无法确定用户账户'),
              ('Result: No users found/unknown result', '结果：未发现用户或结果未知'),
              ('Result: Querying of system users skipped', '结果：跳过系统用户查询'),
              ('- Query system users (non daemons)', '- 查询系统用户（非守护进程账户）'),
              ('Real user: ${I}', '真实用户：${I}'),
              ('Query NIS+ authentication support', '查询 NIS+ 身份验证支持'),
              ('Result: NIS+ authentication not enabled', '结果：未启用 NIS+ 身份验证'),
              ('- NIS+ authentication support', '- NIS+ 身份验证支持'),
              ('Result: NIS+ authentication enabled', '结果：已启用 NIS+ 身份验证'),
              ('Result: /etc/nsswitch.conf not found', '结果：未找到 /etc/nsswitch.conf'),
              ('Query NIS authentication support', '查询 NIS 身份验证支持'),
              ('Result: NIS authentication not enabled', '结果：未启用 NIS 身份验证'),
              ('- NIS authentication support', '- NIS 身份验证支持'),
              ('Result: NIS authentication enabled', '结果：已启用 NIS 身份验证'),
              ('Checking sudoers file', '检查 sudoers 文件'),
              ('Test: checking presence ${I}', '检查：确认 ${I} 是否存在'),
              ('Result: found file (${SUDOERS_FILE})', '结果：发现文件（${SUDOERS_FILE}）'),
              ('Result: file ${I} not found', '结果：未找到文件 ${I}'),
              ('Result: sudoers file found (${SUDOERS_FILE})', '结果：发现 sudoers 文件（${SUDOERS_FILE}）'),
              ('- Sudoers file(s)', '- Sudoers 文件'),
              ('Result: sudoers file NOT found', '结果：未找到 sudoers 文件'),
              ('- Sudoers file', '- Sudoers 文件'),
              ('Check ownership and permissions for sudo configuration files', '检查 sudo 配置文件的所有者和权限'),
              ('Test: checking drop-in directory (${SUDOERS_D})', '检查：检查附加配置目录（${SUDOERS_D}）'),
              ('Result: Found directory permissions: ${FIND} and owner UID GID: ${FIND2}', '结果：目录权限为 ${FIND}，所有者 UID/GID 为 ${FIND2}'),
              ('Result: directory ${SUDOERS_D} permissions OK', '结果：目录 ${SUDOERS_D} 权限正常'),
              ('Result: directory ${SUDOERS_D} ownership OK', '结果：目录 ${SUDOERS_D} 所有者正常'),
              ('- Permissions for directory: ${SUDOERS_D}', '- 目录权限：${SUDOERS_D}'),
              ('Result: directory ${SUDOERS_D} has possibly unsafe ownership', '结果：目录 ${SUDOERS_D} 的所有者可能不安全'),
              ('Result: directory ${SUDOERS_D} has possibly unsafe permissions', '结果：目录 ${SUDOERS_D} 的权限可能不安全'),
              ('Test: checking file (${f})', '检查：检查文件（${f}）'),
              ('Result: Found file permissions: ${FIND} and owner UID GID: ${FIND2}', '结果：文件权限为 ${FIND}，所有者 UID/GID 为 ${FIND2}'),
              ('Result: file ${f} permissions OK', '结果：文件 ${f} 权限正常'),
              ('Result: file ${f} ownership OK', '结果：文件 ${f} 所有者正常'),
              ('- Permissions for: ${f}', '- 权限：${f}'),
              ('Result: file ${f} has possibly unsafe ownership', '结果：文件 ${f} 的所有者可能不安全'),
              ('Result: file ${f} has possibly unsafe permissions', '结果：文件 ${f} 的权限可能不安全'),
              ('Solaris passwordless accounts', '检查 Solaris 无密码账户'),
              ('Result: no passwordless accounts found', '结果：未发现无密码账户'),
              ('- Passwordless accounts on Solaris', '- Solaris 无密码账户'),
              ('Found passwordless account (${I})', '发现无密码账户（${I}）'),
          ]

          required = [
              'Check users with an UID of zero',
              'Check password file consistency with pwck',
              'Checking sudoers file',
          ]
          for marker in required:
              if marker not in original:
                  raise SystemExit(f'missing source marker: {marker}')

          applied = 0
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
                  applied += 1

          if applied < 100:
              raise SystemExit(f'too few replacements applied: {applied}')

          path.write_text(text, encoding='utf-8')
          print(f'applied {applied} authentication translations')
          PY

          sh -n include/tests_authentication

      - name: Commit translations and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/localize-authentication.yml
          git config user.name "AshFog Localization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add include/tests_authentication .github/workflows/localize-authentication.yml
          git commit -m "i18n: translate account and authentication checks"
          git push origin HEAD:master
