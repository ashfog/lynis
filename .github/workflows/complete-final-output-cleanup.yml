name: One-time complete final output cleanup

on:
  push:
    branches: [master]
    paths: [.github/workflows/complete-final-output-cleanup.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply final visible-output corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixes={
            'lynis':{
              'LogText "节目顺利结束"':'LogText "程序已成功结束"',
              'Enhance ${PROGRAM_NAME} audits by adding your settings to custom.prf (see ${DEFAULT_PROFILE} for all settings)':'通过在 custom.prf 中添加设置来增强 ${PROGRAM_NAME} 审计（所有设置请参阅 ${DEFAULT_PROFILE}）',
            },
            'include/functions':{
              'Missing parameter when calling IsWorldExecutable function':'调用 IsWorldExecutable 函数时缺少参数',
              'Could not create temporary file':'无法创建临时文件',
              'Date / time :':'日期/时间：',
            },
            'include/tests_filesystems':{
              '--result "INFO"':'--result "信息"',
              '--result "FOUND"':'--result "已发现"',
              '- Swappiness: ${SWAPLEVEL}':'- Swappiness：${SWAPLEVEL}',
              '确定 swappiness 的电平。':'确定 swappiness 级别',
              '检查：检查vm.swappiness的级别：${SWAPLEVEL}':'检查：检查 vm.swappiness 级别：${SWAPLEVEL}',
              '这是swappiness的标准级别':'这是 swappiness 的标准级别',
              '/var/tmp 是 bind 到 /tmp':'/var/tmp 已绑定到 /tmp',
              '/var/tmp 不是 bind 到 /tmp':'/var/tmp 未绑定到 /tmp',
              '未找到安装点 /var/tmp 或预期选项':'未找到挂载点 /var/tmp 或预期选项',
            },
            'include/tests_kernel':{
              '${ECHOCMD} DISABLED':'${ECHOCMD} 已禁用',
              '${ECHOCMD} ENABLED':'${ECHOCMD} 已启用',
            },
            'include/tests_ports_packages':{
              '- 检查存在漏洞的软件包 (glsa-check)':'- 检查存在漏洞的软件包（glsa-check）',
              'YUM utils 软件包':'YUM utilities 软件包',
              '使用 Emerge 安装 gentoolkit 软件包':'使用 emerge 安装 gentoolkit 软件包',
            },
            'include/tests_storage_nfs':{
              'rpcinfo: ${I}':'rpcinfo：${I}',
            },
          }
          changed=[]
          for name,mapping in fixes.items():
            p=Path(name);text=p.read_text(encoding='utf-8');before=text
            for old,new in mapping.items():text=text.replace(old,new)
            if text!=before:p.write_text(text,encoding='utf-8');changed.append(name)

          # Translate remaining fatal/manual/tooltip literal arguments that are known to reach users.
          required_absent={
            'lynis':['Enhance ${PROGRAM_NAME} audits by adding your settings to custom.prf'],
            'include/functions':['Missing parameter when calling IsWorldExecutable function','Could not create temporary file'],
          }
          failures=[]
          for name,strings in required_absent.items():
            text=Path(name).read_text(encoding='utf-8')
            for value in strings:
              if value in text:failures.append(f'{name}: {value}')
          if failures:raise SystemExit('remaining known English output:\n'+'\n'.join(failures))

          # Machine-readable prefixes, URLs, and verified command arguments must stay intact.
          files=[Path('lynis')]+sorted(p for p in Path('include').iterdir() if p.is_file())
          bad=[]
          for p in files:
            try:text=p.read_text(encoding='utf-8')
            except UnicodeDecodeError:continue
            for token in ('https：//','http：//','ftp：//','text：','file：','url：','manual：','command：','details：','solution：'):
              if token in text:bad.append(f'{p}: {token}')
          command_guards={
            'lynis':'"hostname -s"',
            'include/tests_filesystems':'install MODULENAME /bin/true',
            'include/tests_kernel':'/vmlinuz or /boot/vmlinuz',
            'include/tests_mail_messaging':'disable_vrfy_command=no',
            'include/tests_networking':'"hostname"',
            'include/tests_ports_packages':'"pkg audit"',
            'include/tests_time':'${NTPCTLBINARY} -s status',
          }
          for name,value in command_guards.items():
            if value not in Path(name).read_text(encoding='utf-8'):bad.append(f'{name}: missing command {value}')
          if bad:raise SystemExit('semantic guard failed:\n'+'\n'.join(bad))
          Path('/tmp/final-output-files').write_text('\n'.join(changed),encoding='utf-8')
          print('changed',changed)
          PY

          while IFS= read -r file; do
            [ -n "$file" ] && sh -n "$file"
          done < /tmp/final-output-files

          # Validate every top-level shell include and main script, not only changed files.
          sh -n lynis
          for file in include/*; do
            if [ -f "$file" ] && head -n 1 "$file" | grep -q '^#!/bin/sh'; then
              sh -n "$file"
            fi
          done

      - name: Remove temporary audit and commit
        shell: bash
        run: |
          rm -f FINAL_COMPREHENSIVE_OUTPUT_AUDIT.txt COMPLETE_USER_OUTPUT_AUDIT.txt OUTPUT_FUNCTION_AUDIT.txt
          rm -f .github/workflows/complete-final-output-cleanup.yml
          git config user.name "AshFog Localization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "i18n: complete full Chinese user-output localization"
          git push origin HEAD:master
