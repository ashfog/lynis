          changed = 0
          output = []
          for line in lines:
              stripped = line.lstrip()
              new = line
              if not stripped.startswith('#') and any(token in line for token in allowed_tokens):
                  for old, replacement in pairs:
                      if old in new:
                          new = new.replace(old, replacement)
              if new != line:
                  changed += 1
                  if not any(token in line for token in allowed_tokens):
                      raise SystemExit(f'Blocked non-visible line change: {line!r}')
              output.append(new)

          updated = ''.join(output)
          if updated == original or changed < 100:
              raise SystemExit(f'Unexpected translation count: {changed}')
          path.write_text(updated, encoding='utf-8')
          print(f'Changed visible lines: {changed}')
          PY

