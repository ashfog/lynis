name: One-time package output localization

on:
  push:
    branches: [master]
    paths: [.github/workflows/localize-ports-packages-visible.yml]

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Translate user-visible package output only
