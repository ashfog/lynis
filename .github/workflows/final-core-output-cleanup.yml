name: One-time final core output cleanup

on:
  push:
    branches: [master]
    paths: [.github/workflows/final-core-output-cleanup.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Translate remaining core output functions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
            'include/binaries': {
              'Suspicious location (${SCANDIR}) in PATH discovered. Quitting...': '在 PATH 中发现可疑位置（${SCANDIR}），程序将退出……',
            },
            'include/functions': {
              'Result: search search string \'${STRING}\' NOT found': '结果：未找到搜索字符串 \'${STRING}\'',
              '结果：找到搜索字符串 NOT': '结果：未找到搜索字符串',
              'Error in function call to CheckItem': '调用 CheckItem 函数时发生错误',
              'Could not create a temporary file': '无法创建临时文件',
              'Missing parameter when calling DirectoryExists function': '调用 DirectoryExists 函数时缺少参数',
              'Could not find or read profile (${FILE})': '找不到或无法读取配置文件（${FILE}）',
              'INVALID OPTION（显示）：1 美元': '无效选项（Display）：$1',
              '${WARNING}Error${NORMAL}: ${BOLD}$1${NORMAL}': '${WARNING}错误${NORMAL}：${BOLD}$1${NORMAL}',
              '  ${WARNING}Exception found!${NORMAL}': '  ${WARNING}发现异常！${NORMAL}',
              '  Function/test:  [$1]': '  函数/检查：    [$1]',
              '  Message:        ${BOLD}$2${NORMAL}': '  消息：         ${BOLD}$2${NORMAL}',
              '  Help improving the Lynis community with your feedback!': '  请提供反馈，帮助改进 Lynis 社区版本！',
              '  Steps:': '  操作步骤：',
              '  - Ensure you are running the latest version ($0 update check)': '  - 确认当前运行的是最新版本（$0 update check）',
              '  - If so, create a GitHub issue at ${PROGRAM_SOURCE}': '  - 如果问题仍然存在，请在 ${PROGRAM_SOURCE} 提交 GitHub issue',
              '  - Include relevant parts of the log file or configuration file': '  - 附上日志文件或配置文件中的相关内容',
              '  Thanks!': '  谢谢！',
              '  ${BG_BLUE}[TIP]${NORMAL}: ${LIGHTBLUE}$1${NORMAL}': '  ${BG_BLUE}[提示]${NORMAL}：${LIGHTBLUE}$1${NORMAL}',
              '  [TIP]: $1': '  [提示]：$1',
              '  ${BG_WARNING}[WARNING]${NORMAL}: $1${NORMAL}': '  ${BG_WARNING}[警告]${NORMAL}：$1${NORMAL}',
              '  [WARNING]: $1': '  [警告]：$1',
              '${RED}Fatal error${NORMAL}: ${WHITE}$1${NORMAL}': '${RED}致命错误${NORMAL}：${WHITE}$1${NORMAL}',
              'Missing parameter when calling FileExists function': '调用 FileExists 函数时缺少参数',
              'Missing parameter when calling FileIsEmpty function': '调用 FileIsEmpty 函数时缺少参数',
              'Function FileIsReadable() called without a file name': '调用 FileIsReadable() 时未提供文件名',
              'No parameters provided to GetReportData() function': '调用 GetReportData() 函数时未提供参数',
              'Invalid option provided to GetReportData() function': '向 GetReportData() 函数提供了无效选项',
              'Incorrect usage of HasCorrectFilePermissions': 'HasCorrectFilePermissions 函数使用方式不正确',
              'Function HasData called without parameters - look in log to determine where this happened, or use sh -x lynis to see all details.': '调用 HasData 函数时未提供参数；请查看日志确定调用位置，或使用 sh -x lynis 查看详细信息。',
              'Function IsEmpty called without parameters - look in log to determine where this happened, or use sh -x lynis to see all details.': '调用 IsEmpty 函数时未提供参数；请查看日志确定调用位置，或使用 sh -x lynis 查看详细信息。',
              'Missing parameter when calling IsRunning function': '调用 IsRunning 函数时缺少参数',
              'Missing process to search for when using IsRunning function': '使用 IsRunning 函数时未提供要搜索的进程',
              'Missing parameter when calling IsWorldReadable function': '调用 IsWorldReadable 函数时缺少参数',
              'Missing parameter when calling IsWorldWritable function': '调用 IsWorldWritable 函数时缺少参数',
              'Incorrect usage of PackageIsInstalled function': 'PackageIsInstalled 函数使用方式不正确',
              'No arguments provided to ParseNginx()': '调用 ParseNginx() 时未提供参数',
              'Error in function call to PortIsListening': '调用 PortIsListening 函数时发生错误',
              'Expected 1 parameter, received none or multiple': '应提供 1 个参数，但实际未提供或提供了多个参数',
              'INVALID OPTION（注册）：1 美元': '无效选项（Register）：$1',
              'Deprecated usage of ReportWarning() function': '使用了已弃用的 ReportWarning() 函数调用方式',
              'No argument or too many arguments provided to SafeInput()': '调用 SafeInput() 时未提供参数或参数过多',
              'No argument or too many arguments provided to SafeFile()': '调用 SafeFile() 时未提供参数或参数过多',
              'Fatal error: file $1 does not exist': '致命错误：文件 $1 不存在',
              'Not enough arguments for function SearchItem()': '调用 SearchItem() 函数时参数不足',
              'Function ShowSymlinkPath() called without a file name': '调用 ShowSymlinkPath() 时未提供文件名',
              'ERROR: No result returned from function (TestValue). Incorrect usage?': '错误：TestValue 函数未返回结果，可能使用方式不正确。',
              'INVALID OPTION（报告详细信息）：1 美元': '无效选项（ReportDetails）：$1',
              'INVALID OPTION（StoreNginx 设置）：1 美元 2 美元': '无效选项（StoreNginxSettings）：$1 $2',
              'INVALID OPTION USED（测试值）：1 美元': '使用了无效选项（TestValue）：$1',
              'Date / time : $(date "+%Y-%m-%d %H:%M:%S")': '日期/时间：$(date "+%Y-%m-%d %H:%M:%S")',
              '主动检查：${TEST_NO:-NONE}': '当前检查：${TEST_NO:-无}',
              '  [${WHITE}${STANDARD_FRIENDLY_NAME} ${STANDARD_VERSION}${NORMAL}] - ${CYAN}Section ${STANDARD_SECTION}${NORMAL} - ${WHITE}${STANDARD_SECTION_TITLE}${NORMAL}': '  [${WHITE}${STANDARD_FRIENDLY_NAME} ${STANDARD_VERSION}${NORMAL}] - ${CYAN}章节 ${STANDARD_SECTION}${NORMAL} - ${WHITE}${STANDARD_SECTION_TITLE}${NORMAL}',
              '  - Details:        ${REASON}': '  - 详情：          ${REASON}',
              '  - Configuration:  ${RED}${ACTUAL_VALUE}${NORMAL} / ${EXPECTED_VALUE}': '  - 配置：          ${RED}${ACTUAL_VALUE}${NORMAL} / ${EXPECTED_VALUE}',
              '硬化：为此项目指定最大硬化点数 (${HPADDMAX})。目前拥有 ${HPPOINTS} 积分（${HPTOTAL} 中）': '加固：此项目获得全部加固得分（${HPADDMAX}）。当前总得分为 ${HPPOINTS}/${HPTOTAL}',
              '硬化：分配部分硬化点（${HPADD} 或 ${HPADDMAX}）。目前拥有 ${HPPOINTS} 积分（来自 ${HPTOTAL}）': '加固：此项目获得部分加固得分（${HPADD}/${HPADDMAX}）。当前总得分为 ${HPPOINTS}/${HPTOTAL}',
              '结果：正确的权限 (${DATA})': '结果：权限正确（${DATA}）',
              '操作：解析配置文件${CONFIG_FILE}': '操作：解析配置文件 ${CONFIG_FILE}',
              '结果：发现服务正在端口 $2 ($1) 上侦听': '结果：发现服务正在端口 $2（$1）上监听',
              '结果：未找到在端口 $2 ($1) 上侦听的服务': '结果：未找到在端口 $2（$1）上监听的服务',
              '错误：对 AddSetting 的调用不正确。需要 3 个参数。': '错误：AddSetting 调用方式不正确，需要 3 个参数。',
              '异常：测试有一个异常事件 ($1)，文本为 ${2-NoText}': '异常：检查 $1 发生异常，消息为 ${2-NoText}',
              '手动：需要一个或多个手动操作来进一步测试该控件/插件': '手动操作：需要执行一个或多个手动步骤，才能进一步检查该控制项或插件',
              '配置跳过的原子测试 ($1) (skip-test)': '通过配置跳过原子检查 $1（skip-test）',
              '在没有正确数量的参数的情况下调用函数 (1)': '调用函数时参数数量不正确（需要 1 个参数）',
              '设置临时 pythonbinary 变量': '设置临时 PYTHONBINARY 变量',
              '设置临时 readlinkbinary 变量': '设置临时 READLINKBINARY 变量',
              '注意：使用真实的 readlink 二进制文件来确定 ${sFILE} 上的符号链接': '注意：使用 readlink 程序确定 ${sFILE} 的符号链接目标',
              '结果：readlink 显示 ${tFILE} 作为输出': '结果：readlink 返回 ${tFILE}',
              '结果：此符号链接链接到另一个符号链接': '结果：该符号链接指向另一个符号链接',
              '错误的来宾 OS（仅限 ${TEST_NEED_OS}）': '操作系统不匹配（仅适用于 ${TEST_NEED_OS}）',
              '类别不正确（仅限 ${TEST_CATEGORY_TO_CHECK}）': '检查类别不匹配（仅执行 ${TEST_CATEGORY_TO_CHECK}）',
              '硬件平台不正确（仅限 ${TEST_NEED_PLATFORM}）': '硬件平台不匹配（仅适用于 ${TEST_NEED_PLATFORM}）',
              '需要已知的包管理器来测试特定包的存在': '需要可识别的软件包管理器才能检查特定软件包',
              '本次测试需要root权限': '此检查需要 root 权限',
              '被配置跳过': '已通过配置跳过',
              '测试不在要执行的测试列表中': '该检查不在本次要执行的检查列表中',
              '测试系统密集扫描模式 (H)': '当前扫描模式不执行高强度检查（H）',
              '测试系统密集扫描模式 (M)': '当前扫描模式不执行中等强度检查（M）',
              '通过配置文件设置跳过（跳过测试）': '已通过配置文件的 skip-test 设置跳过',
              'nanoseconds': '纳秒',
              'seconds': '秒',
            },
            'include/profiles': {
              'unexpected characters in profile. Stopping execution (security measure)': '配置文件中包含异常字符，出于安全考虑停止执行',
              '您的个人资料中有一行或多行采用旧格式（键：值）。它们需要转换为新格式（key=value) 或禁用。': '配置文件中有一行或多行采用旧格式（key:value），需要转换为新格式（key=value）或将其禁用。',
              '使用grep查看相关匹配项（grep -E \\"^[a-z-]{1,}:\\" custom.prf）': '使用 grep 查看相关匹配项（grep -E \\"^[a-z-]{1,}:\\" custom.prf）',
              "Replace deprecated option 'test_skip_always' and replace with 'skip-test' (add to custom.prf)": "将已弃用的选项 'test_skip_always' 替换为 'skip-test'（添加到 custom.prf）",
              "Replace deprecated option 'upload_server' and replace with 'upload-server' (add to custom.prf)": "将已弃用的选项 'upload_server' 替换为 'upload-server'（添加到 custom.prf）",
              '${RED}Error${NORMAL}: found one or more errors in profile ${PROFILE}': '${RED}错误${NORMAL}：配置文件 ${PROFILE} 中发现一个或多个错误',
              'Full line: ${CONFIGOPTION}': '完整配置行：${CONFIGOPTION}',
              "${WHITE}Details${NORMAL}: Unknown option '${YELLOW}${OPTION}${NORMAL}' found (with value: ${VALUE})": "${WHITE}详情${NORMAL}：发现未知选项 '${YELLOW}${OPTION}${NORMAL}'（值：${VALUE}）",
              '更新您的个人资料': '更新配置文件',
              '- 检查个人资料...': '- 检查配置文件……',
            },
            'include/osdetection': {
              'This operating system seems be end-of-life and may no longer receive updates or support!': '此操作系统似乎已结束生命周期，可能不再接收更新或支持！',
              'This operating system seems not to be end-of-life yet': '此操作系统似乎尚未结束生命周期',
            },
            'include/tests_kernel': {
              "Manually check to confirm you're using a recent kernel and grsecurity patch": '手动确认当前使用的是较新的内核和 grsecurity 补丁',
            },
          }

          changed=[]
          for name, mapping in replacements.items():
              path=Path(name)
              text=path.read_text(encoding='utf-8')
              before=text
              for old,new in mapping.items():
                  text=text.replace(old,new)
              if text!=before:
                  path.write_text(text,encoding='utf-8')
                  changed.append(name)

          profiles=Path('include/profiles')
          text=profiles.read_text(encoding='utf-8')
          desc_map={
            'Colored screen output':'彩色屏幕输出',
            'Connections (max-wait-state)':'连接数（最大等待状态）',
            'Control URL (append)':'控制 URL（追加内容）',
            'Control URL (prepend)':'控制 URL（前置内容）',
            'Control URL (protocol)':'控制 URL（协议）',
            'Custom URL (append)':'自定义 URL（追加内容）',
            'Custom URL (prepend)':'自定义 URL（前置内容）',
            'Custom URL (protocol)':'自定义 URL（协议）',
            'Skip checking for a security repository (Debian and others)':'跳过安全软件仓库检查（Debian 等系统）',
            'Debugging mode':'调试模式',
            'Developer mode':'开发者模式',
            'Use non-zero exit code if one or more warnings were found':'发现一个或多个警告时使用非零退出码',
            'Group':'组',
            'Language':'语言',
            'License key':'许可证密钥',
            'Machine role (personal, workstation or server)':'机器角色（个人设备、工作站或服务器）',
            'NTP role (server or client)':'NTP 角色（服务器或客户端）',
            'Pause between tests (in seconds)':'检查之间的暂停时间（秒）',
            'Plugin directory':'插件目录',
            'Quick mode (non-interactive)':'快速模式（非交互）',
            'Refresh repositories (for vulnerable package detection)':'刷新软件仓库（用于检测存在漏洞的软件包）',
            'Show tool tips':'显示工具提示',
            'Show only warnings':'仅显示警告',
            'Skip plugins':'跳过插件',
            'Paths for SSL certificates':'SSL 证书路径',
            'Paths that should be ignored for SSL certificates':'搜索 SSL 证书时要忽略的路径',
            'Scan mode':'扫描模式',
            'Data upload after scanning':'扫描后上传数据',
            'Compressed uploads':'压缩上传数据',
            'Upload options':'上传选项',
            'Proxy port':'代理端口',
            'Proxy protocol':'代理协议',
            'Proxy server':'代理服务器',
            'Upload server (ip or hostname)':'上传服务器（IP 或主机名）',
            'Upload tool':'上传工具',
            'Upload tool (arguments)':'上传工具（参数）',
            'Verbose output':'详细输出',
            'Logging of tests that have a different OS':'记录适用于其他操作系统的检查',
            'Show more details in report (solution)':'在报告中显示更多详情（解决方案）',
            'Skip upgrade test':'跳过升级检查',
            'Perform strict code test of scripts':'对脚本执行严格代码检查',
          }
          pattern=re.compile(r'(AddSetting\s+"[^"]*"\s+"[^"]*"\s+")([^"]*)(")')
          remaining=[]
          def replace_desc(match):
              value=match.group(2)
              if value in desc_map:
                  value=desc_map[value]
              elif re.search(r'[A-Za-z]{3,}\s+[A-Za-z]{3,}',value):
                  remaining.append(value)
              return match.group(1)+value+match.group(3)
          updated=pattern.sub(replace_desc,text)
          if remaining:
              raise SystemExit('untranslated AddSetting descriptions:\n'+'\n'.join(sorted(set(remaining))))
          if updated!=text:
              profiles.write_text(updated,encoding='utf-8')
              if 'include/profiles' not in changed:changed.append('include/profiles')

          Path('/tmp/core-output-changed').write_text('\n'.join(changed),encoding='utf-8')
          print('changed',changed)
          PY

          while IFS= read -r file; do
            [ -n "$file" ] && sh -n "$file"
          done < /tmp/core-output-changed

      - name: Remove audit report and commit
        shell: bash
        run: |
          rm -f COMPLETE_USER_OUTPUT_AUDIT.txt
          rm -f .github/workflows/final-core-output-cleanup.yml
          git config user.name "AshFog Localization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "i18n: translate remaining core output functions"
          git push origin HEAD:master
