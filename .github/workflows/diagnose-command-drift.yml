name: One-time command drift diagnostic
on:
  push:
    branches: [master]
    paths: [.github/workflows/diagnose-command-drift.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: master, fetch-depth: 0}
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          BASE='f36363355cbafd488e37ac05702cd76bb2ee5e37';q=re.compile(r'"((?:\\.|[^"\\])*)"')
          schemes=('text:','file:','url:','manual:','command:','details:','solution:')
          known={'hostname','postconf','sysctl','grep','awk','sed','find','chmod','chown','systemctl','service','ntpq','ntpctl','mount','umount','modprobe','apt','apt-get','dpkg','rpm','yum','dnf','pacman','apk','pkg','openssl','ssh','sshd','ss','netstat','ifconfig','ip','auditctl','sestatus','semanage','aa-status','apparmor_status','timedatectl','resolvectl','journalctl','logrotate','newsyslog','squid','nginx','apachectl','httpd','php','python','perl','ruby','docker','podman'}
          def cmd(x):
            x=x.strip()
            if not x:return True
            if x.startswith(('http://','https://','ftp://')):return True
            if re.search(r'[|><;&]|\$\(|/|--|(^|\s)-[A-Za-z0-9]|=',x):return True
            if re.fullmatch(r'\$\{[^}]+\}',x):return True
            if re.fullmatch(r'[A-Za-z0-9_.+:-]+',x):return True
            return x.split()[0].lower() in known
          rows=[]
          files=[Path('lynis')]+sorted(p for p in Path('include').iterdir() if p.is_file())
          for p in files:
            try:cur=p.read_text(encoding='utf-8');old=subprocess.check_output(['git','show',f'{BASE}:{p}'],text=True)
            except Exception:continue
            cl=cur.splitlines();ol=old.splitlines()
            if len(cl)!=len(ol):
              rows.append(f'{p}: line-count {len(cl)} != {len(ol)}');continue
            for n,(a,b) in enumerate(zip(cl,ol),1):
              fn=next((f for f in ('ReportWarning ','ReportSuggestion ','ReportException ') if f in a and f in b),None)
              if not fn:continue
              cs=list(q.finditer(a));ps=list(q.finditer(b));cp=a.find(fn);op=b.find(fn)
              ci=[m.group(1) for m in cs if m.start()>cp];pi=[m.group(1) for m in ps if m.start()>op]
              if len(ci)!=len(pi):
                rows.append(f'{p}:{n}: arg-count {len(ci)} != {len(pi)}');continue
              for i in range(2,len(pi)):
                pv=pi[i]
                if cmd(pv) and not any(pv.lower().startswith(s) for s in schemes) and ci[i]!=pv:
                  rows.append(f'{p}:{n}: arg{i} current={ci[i]!r} original={pv!r}')
          Path('FINAL_COMMAND_DRIFT.txt').write_text('# Command drift\n# Count: '+str(len(rows))+'\n\n'+'\n'.join(rows)+'\n',encoding='utf-8')
          print(len(rows))
          PY
          rm -f .github/workflows/diagnose-command-drift.yml
          git config user.name 'AshFog Localization Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add FINAL_COMMAND_DRIFT.txt .github/workflows/diagnose-command-drift.yml
          git commit -m 'chore: report localization command drift'
          git push origin HEAD:master
