name: One-time package visible text cleanup

on:
  push:
    branches: [master]
    paths: [.github/workflows/clean-package-visible-text.yml]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Clean remaining visible text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('include/tests_ports_packages')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('LogText "Test: 查询 apk info -v to get package list"', 'LogText "检查：运行 apk info -v 获取软件包列表"'),
              ('LogText "Test: 查询 dpkg -l to get package list"', 'LogText "检查：运行 dpkg -l 获取软件包列表"'),
              ('LogText "Test: 查询 dpkg -l to get unpurged packages"', 'LogText "检查：运行 dpkg -l 查询未彻底清除的软件包"'),
              ('LogText "结果：未发现存在漏洞的软件包 via apt-check"', 'LogText "结果：apt-check 未发现存在漏洞的软件包"'),
              ('LogText "结果：发现存在漏洞的软件包 via apt-get (-security channel)"', 'LogText "结果：apt-get 在 -security 渠道中发现存在漏洞的软件包"'),
              ('ReportSuggestion "${TEST_NO}" "删除不需要的内核软件包 with package-cleanup utility (--old-kernels)"', 'ReportSuggestion "${TEST_NO}" "使用 package-cleanup --old-kernels 删除不需要的内核软件包"'),
          ]
          changed = 0
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
              text = text.replace(old, new)
              changed += 1
          path.write_text(text, encoding='utf-8')
          print(f'Cleaned visible lines: {changed}')
          PY
          sh -n include/tests_ports_packages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/tests_ports_packages
          git commit -m "i18n: clean remaining package output"
          git push origin master
          rm .github/workflows/clean-package-visible-text.yml
          git add .github/workflows/clean-package-visible-text.yml
          git commit -m "chore: remove package cleanup workflow"
          git push origin master
