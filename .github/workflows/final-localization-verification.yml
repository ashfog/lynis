name: One-time final localization verification

on:
  push:
    branches: [master]
    paths: [.github/workflows/final-localization-verification.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Final wording cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          Q=re.compile(r'"((?:\\.|[^"\\])*)"')
          EXACT={
            '找到已知的二进制文件：aa-status（apparmor 组件）- ${BINARY}':'发现已知程序：aa-status（AppArmor 组件）- ${BINARY}',
            '结果：未找到 aa-status 二进制文件，AppArmor 未安装':'结果：未找到 aa-status 程序，AppArmor 未安装',
            '结果：发现 aa-status 二进制文件，已安装 AppArmor':'结果：发现 aa-status 程序，已安装 AppArmor',
            '结果：没有可用的 aa-status 二进制文件':'结果：没有可用的 aa-status 程序',
            'text:运行aa-status':'text:运行 aa-status',
            '测试跳过 lsmod 二进制文件未找到或 /proc/modules 无法打开':'已跳过检查：未找到 lsmod 程序或无法打开 /proc/modules',
          }
          def fields(line,sp):
            s=line.lstrip();o=set()
            if not s or s.startswith('#'):return o
            if 'Register ' in line and '--description' in line:
              p=line.find('--description')
              for i,m in enumerate(sp):
                if m.start()>p:o.add(i);break
            if 'Display ' in line:
              for f in ('--text','--result'):
                p=line.find(f)
                if p>=0:
                  for i,m in enumerate(sp):
                    if m.start()>p:o.add(i);break
            if any(x in line for x in ('DisplayError ','DisplayWarning ','DisplaySuggestion ')) and sp:o.add(0)
            if 'LogText ' in line:
              p=line.find('LogText ')
              for i,m in enumerate(sp):
                if m.start()>p:o.add(i);break
            for fn in ('ReportWarning ','ReportSuggestion ','ReportException '):
              p=line.find(fn)
              if p>=0:
                a=[i for i,m in enumerate(sp) if m.start()>p]
                if len(a)>=2:o.add(a[1])
                for i in a[2:]:
                  if sp[i].group(1).startswith(('text:','manual:','details:','solution:')):o.add(i)
            if 'SKIPREASON=' in line:
              p=line.find('SKIPREASON=')
              for i,m in enumerate(sp):
                if m.start()>p:o.add(i);break
            if s.startswith(('echo ','printf ')) or re.match(r'^(?:if .*; then )?(?:echo|printf) ',s):o.update(range(len(sp)))
            return o

          files=[Path('lynis')]+sorted(p for p in Path('include').iterdir() if p.is_file())
          changed=[]
          for p in files:
            try:lines=p.read_text(encoding='utf-8').splitlines(keepends=True)
            except UnicodeDecodeError:continue
            out=[];touch=False
            for line in lines:
              sp=list(Q.finditer(line));ids=fields(line,sp)
              if not ids:out.append(line);continue
              vals=[m.group(1) for m in sp]
              for i in ids:
                v=vals[i]
                v=EXACT.get(v,v)
                v=v.replace('测试：','检查：')
                v=v.replace('找到已知的二进制文件：','发现已知程序：')
                v=v.replace(' aa-status 二进制文件',' aa-status 程序')
                v=v.replace('text:运行aa-status','text:运行 aa-status')
                vals[i]=v.replace('"','\\"')
              parts=[];last=0
              for m,v in zip(sp,vals):parts.append(line[last:m.start(1)]);parts.append(v);last=m.end(1)
              parts.append(line[last:]);new=''.join(parts)
              touch |= new!=line;out.append(new)
            if touch:p.write_text(''.join(out),encoding='utf-8');changed.append(str(p))
          Path('/tmp/final-verify-files').write_text('\n'.join(changed),encoding='utf-8')
          PY
          while IFS= read -r file; do [ -n "$file" ] && sh -n "$file"; done < /tmp/final-verify-files

      - name: Verify commands and machine-readable prefixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required={
            'lynis':'ReportSuggestion "LYNIS" "检查您的主机名配置" "hostname -s"',
            'include/tests_filesystems':'"添加 install MODULENAME /bin/true（不含引号）"',
            'include/tests_kernel':'"/vmlinuz or /boot/vmlinuz"',
            'include/tests_mail_messaging':'"disable_vrfy_command=no" "text:运行 postconf -e disable_vrfy_command=yes 修改该值"',
            'include/tests_networking':'"hostname" "text:请查看日志文件中的无效字符"',
            'include/tests_ports_packages':'"pkg audit" "text:运行 pkg audit -F"',
            'include/tests_time':'"${NTPCTLBINARY} -s status"',
          }
          errors=[]
          for f,s in required.items():
            if s not in Path(f).read_text(encoding='utf-8'):errors.append(f'{f}: missing {s}')
          files=[Path('lynis')]+sorted(p for p in Path('include').iterdir() if p.is_file())
          for p in files:
            try:t=p.read_text(encoding='utf-8')
            except UnicodeDecodeError:continue
            for token in ('https：//','http：//','ftp：//','text：','file：','url：','manual：','command：','details：','solution：'):
              if token in t:errors.append(f'{p}: broken prefix {token}')
          if errors:raise SystemExit('\n'.join(errors))
          print('command and prefix verification passed')
          PY

      - name: Remove reports and commit
        shell: bash
        run: |
          rm -f NATURAL_LOCALIZATION_REPORT.txt LOCALIZATION_POLISH_REPORT.txt
          rm -f VISIBLE_ENGLISH_REPORT.txt VISIBLE_ENGLISH_SUMMARY.txt VISIBLE_ENGLISH_STRICT.txt FINAL_COMMAND_DRIFT.txt
          rm -f .github/workflows/final-localization-verification.yml
          git config user.name "AshFog Localization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "i18n: finalize verified Chinese localization"
          git push origin HEAD:master
