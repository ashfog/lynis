name: One-time finish visible localization

on:
  push:
    branches: [master]
    paths: [.github/workflows/finish-visible-localization.yml]

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Translate remaining active user-visible strings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

