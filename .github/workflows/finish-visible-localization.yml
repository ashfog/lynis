          changed_files = []
          total = 0
          for name, pairs in R.items():
              path = Path(name)
              if not path.exists():
                  print(f'skip missing {name}')
                  continue
              text = path.read_text(encoding='utf-8')
              before = text
              applied = 0
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
                      applied += 1
              if text != before:
                  path.write_text(text, encoding='utf-8')
                  changed_files.append(name)
                  total += applied
                  print(f'{name}: {applied} replacements')
          if total < 150:
              raise SystemExit(f'too few replacements applied: {total}')
          Path('/tmp/changed-localization-files').write_text('\n'.join(changed_files), encoding='utf-8')
          print(f'total replacements: {total}; changed files: {len(changed_files)}')
          PY

          while IFS= read -r file; do
            [ -n "$file" ] && sh -n "$file"
          done < /tmp/changed-localization-files

      - name: Commit localization and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/finish-visible-localization.yml
          git config user.name "AshFog Localization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lynis include .github/workflows/finish-visible-localization.yml
          git commit -m "i18n: finish remaining user-visible output"
          git push origin HEAD:master
