name: One-time time synchronization localization

on:
  push:
    branches: [master]
    paths: [.github/workflows/localize-time.yml]

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Translate time synchronization checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('include/tests_time')
          text = path.read_text(encoding='utf-8')
          original = text
          replacements = [
              ('Check for running NTP daemon or client', '检查正在运行的 NTP 守护进程或客户端'),
              ('Test: Searching for a running NTP daemon or available client', '检查：搜索正在运行的 NTP 守护进程或可用客户端'),
              ('result: found chrony configuration: ${FILE}', '结果：发现 chrony 配置文件 ${FILE}'),
              ('- NTP daemon found: chronyd', '- 发现 NTP 守护进程：chronyd'),
              ('Result: found chrony configuration, but no running daemon', '结果：发现 chrony 配置，但守护进程未运行'),
              ('Result: no chrony configuration found', '结果：未发现 chrony 配置'),
              ('- NTP daemon found: dntpd', '- 发现 NTP 守护进程：dntpd'),
              ('result: found openntpd (method: ntpctl)', '结果：发现 openntpd（检测方式：ntpctl）'),
              ('result: found openntpd (method: ps)', '结果：发现 openntpd（检测方式：ps）'),
              ('result: running openntpd not found, but ntpctl is installed', '结果：未发现正在运行的 openntpd，但已安装 ntpctl'),
              ('- NTP daemon found: OpenNTPD', '- 发现 NTP 守护进程：OpenNTPD'),
              ('Result: found running NTP daemon in process list', '结果：在进程列表中发现正在运行的 NTP 守护进程'),
              ('- NTP daemon found: ntpd', '- 发现 NTP 守护进程：ntpd'),
              ('- NTP daemon found: timed', '- 发现 NTP 守护进程：timed'),
              ('- NTP daemon found: systemd (timesyncd)', '- 发现 NTP 守护进程：systemd-timesyncd'),
              ('Result: Found running systemd-timesyncd in process list', '结果：在进程列表中发现正在运行的 systemd-timesyncd'),
              ('Test: checking for ntpdate, rdate, sntp or ntpdig in crontab file ${I}', '检查：在 crontab 文件 ${I} 中搜索 ntpdate、rdate、sntp 或 ntpdig'),
              ('- Checking NTP client in crontab file (${I})', '- 检查 crontab 文件中的 NTP 客户端（${I}）'),
              ('Result: found ntpdate, rdate, sntp or ntpdig reference in crontab file ${I}', '结果：在 crontab 文件 ${I} 中发现 ntpdate、rdate、sntp 或 ntpdig 配置'),
              ('Result: no ntpdate, rdate, sntp or ntpdig reference found in crontab file ${I}', '结果：crontab 文件 ${I} 中未发现 ntpdate、rdate、sntp 或 ntpdig 配置'),
              ('Result: crontab file ${I} not found', '结果：未找到 crontab 文件 ${I}'),
              ('Test: checking for ntpdate, rdate, sntp or ntpdig in ${J}', '检查：在 ${J} 中搜索 ntpdate、rdate、sntp 或 ntpdig'),
              ('Result: found ntpdate, rdate, sntp or ntpdig in ${J}', '结果：在 ${J} 中发现 ntpdate、rdate、sntp 或 ntpdig'),
              ('- Checking NTP client in cron files', '- 检查 cron 文件中的 NTP 客户端'),
              ('Result: found ntpdate or rdate in cron directory', '结果：在 cron 目录中发现 ntpdate 或 rdate'),
              ('Result: no ntpdate or rdate found in cron directories', '结果：cron 目录中未发现 ntpdate 或 rdate'),
              ('Test: checking for file /etc/network/if-up.d/ntpdate', '检查：确认文件 /etc/network/if-up.d/ntpdate 是否存在'),
              ('Result: found ntpdate action when network interface comes up', '结果：发现网络接口启动时执行的 ntpdate 操作'),
              ('- Checking event based ntpdate (if-up)', '- 检查基于网络事件的 ntpdate（if-up）'),
              ('Result: file /etc/network/if-up.d/ntpdate does not exist', '结果：文件 /etc/network/if-up.d/ntpdate 不存在'),
              ('Test: Checking if ntpdate is enabled at startup in *BSD', '检查：确认 *BSD 是否在启动时启用 ntpdate'),
              ('Result: ntpdate is enabled in rc.conf', '结果：rc.conf 中已启用 ntpdate'),
              ('Although ntpdate is enabled in rc.conf, it is advised to run it at least daily or use a NTP daemon', '虽然 rc.conf 中已启用 ntpdate，但建议至少每天运行一次，或改用 NTP 守护进程'),
              ('Result: ntpdate is not enabled in rc.conf', '结果：rc.conf 中未启用 ntpdate'),
              ("Result: Skipping display warning, as virtual machines usually don't need time synchronization in the VM itself", '结果：虚拟机通常无需在虚拟机内部单独同步时间，因此不显示警告'),
              ('- Checking for a running NTP daemon or client', '- 检查正在运行的 NTP 守护进程或客户端'),
              ('Result: Could not find a NTP daemon or client', '结果：未找到 NTP 守护进程或客户端'),
              ('Use NTP daemon or NTP client to prevent time issues.', '使用 NTP 守护进程或客户端避免时间问题。'),
              ('Result: Found a time syncing daemon/client.', '结果：发现时间同步守护进程或客户端。'),
              ('Check systemd NTP time synchronization status', '检查 systemd NTP 时间同步状态'),
              ('Test: Check the status of time synchronization via timedatectl', '检查：通过 timedatectl 检查时间同步状态'),
              ('Result: time not synchronized via NTP', '结果：时间未通过 NTP 同步'),
              ('Check timedatectl output. Synchronization via NTP is enabled, but status reflects it is not synchronized', '检查 timedatectl 输出；NTP 同步已启用，但状态显示尚未同步'),
              ("Check active NTP associations ID's", '检查活动的 NTP 关联 ID'),
              ("Test: Checking for NTP association ID's from ntpq peers list", '检查：从 ntpq peers 列表中检查 NTP 关联 ID'),
              ("- Checking valid association ID's", '- 检查有效的关联 ID'),
              ("Result: Found one or more association ID's", '结果：发现一个或多个关联 ID'),
              ('Check ntp.conf for properly configured NTP servers and a correctly functioning name service.', '检查 ntp.conf 中的 NTP 服务器配置以及名称解析服务是否正常。'),
              ('Check peers with stratum value of 16', '检查 stratum 值为 16 的对等节点'),
              ('Test: Checking stratum 16 sources from ntpq peers list', '检查：从 ntpq peers 列表中检查 stratum 16 时间源'),
              ('- Checking high stratum ntp peers', '- 检查高 stratum NTP 对等节点'),
              ('Result: All peers are lower than stratum 16', '结果：所有对等节点的 stratum 均低于 16'),
              ('Found stratum 16 peer: ${ITEM}', '发现 stratum 16 对等节点：${ITEM}'),
              ('Output: host ${ITEM} ignored by profile', '输出：配置文件已忽略主机 ${ITEM}'),
              ('Result: all non local servers are lower than stratum 16, or whitelisted within the scan profile', '结果：所有非本地服务器的 stratum 均低于 16，或已在扫描配置中加入白名单'),
              ('Result: Found ${COUNT} high stratum (16) peers)', '结果：发现 ${COUNT} 个高 stratum（16）对等节点'),
              ('Check ntpq peers output for stratum 16 peers', '检查 ntpq peers 输出中的 stratum 16 对等节点'),
              ('Check unreliable NTP peers', '检查不可靠的 NTP 对等节点'),
              ('Test: Checking unreliable ntp peers', '检查：检查不可靠的 NTP 对等节点'),
              ('- Checking unreliable ntp peers', '- 检查不可靠的 NTP 对等节点'),
              ('Result: No unreliable peers found', '结果：未发现不可靠的对等节点'),
              ('Result: Found one or more unreliable peers (marked with a minus or dash sign)', '结果：发现一个或多个不可靠的对等节点（以减号或井号标记）'),
              ('Unreliable peer: ${I}', '不可靠的对等节点：${I}'),
              ('Check ntpq peers output for unreliable ntp peers and correct/replace them', '检查 ntpq peers 输出中的不可靠节点，并修正或替换它们'),
              ('Check selected time source', '检查选定的时间源'),
              ('Test: Checking selected time source', '检查：检查选定的时间源'),
              ('- Checking selected time source', '- 检查选定的时间源'),
              ('Result: Found selected time source (value: ${FIND2})', '结果：发现选定的时间源（值：${FIND2}）'),
              ('Result: Found local source as selected time source. This could indicate that no external sources are available to sync with.', '结果：本地时间源被选为同步源，可能表示没有可用的外部时间源。'),
              ('Local source: ${FIND}', '本地时间源：${FIND}'),
              ('Check ntpq peers output for selected time source', '检查 ntpq peers 输出中的选定时间源'),
              ('Check preferred time source', '检查首选时间源'),
              ('Test: Checking preferred time source', '检查：检查首选时间源'),
              ('- Checking time source candidates', '- 检查候选时间源'),
              ('Result: No other time source candidates found', '结果：未发现其他候选时间源'),
              ('Check ntpq peers output for time source candidates', '检查 ntpq peers 输出中的候选时间源'),
              ('Result: Found one or more candidates to synchronize time with.', '结果：发现一个或多个可用于时间同步的候选源。'),
              ('Candidate found: ${I}', '发现候选时间源：${I}'),
              ('Check NTP falsetickers', '检查 NTP 错误时间源（falseticker）'),
              ('- Checking falsetickers', '- 检查错误时间源（falseticker）'),
              ("Result: No falsetickers found (items preceding with an 'x')", "结果：未发现错误时间源（以 'x' 开头的项目）"),
              ("Result: Found one or more falsetickers  (items preceding with an 'x')", "结果：发现一个或多个错误时间源（以 'x' 开头的项目）"),
              ('Falseticker found: ${I}', '发现错误时间源：${I}'),
              ('Check ntpq peers output for falsetickers', '检查 ntpq peers 输出中的错误时间源'),
              ('Check NTP protocol version', '检查 NTP 协议版本'),
              ('Test: Checking NTP protocol version (ntpq -c ntpversion)', '检查：检查 NTP 协议版本（ntpq -c ntpversion）'),
              ('- Checking NTP version', '- 检查 NTP 版本'),
              ('Result: No NTP version found', '结果：未发现 NTP 版本'),
              ('Check ntpq output for NTP protocol version', '检查 ntpq 输出中的 NTP 协议版本'),
              ('Result: Found NTP version ${FIND}', '结果：发现 NTP 版本 ${FIND}'),
              ('Check TZ variable', '检查 TZ 变量'),
              ('Test: testing for TZ variable', '检查：检查 TZ 变量'),
              ('Result: found TZ variable with value ${FIND}', '结果：发现 TZ 变量，值为 ${FIND}'),
              ('Check empty NTP step-tickers', '检查空的 NTP step-tickers 文件'),
              ('Result: ${FILE} exists and it is empty. On RedHat the initial time synchronization will be done with the servers listed in ntp.conf.', '结果：${FILE} 存在但为空；在 Red Hat 系统上，初始时间同步将使用 ntp.conf 中列出的服务器。'),
              ('Result: ${FILE} is empty. The step-tickers contain no configured NTP servers', '结果：${FILE} 为空，step-tickers 中没有配置 NTP 服务器'),
              ('- Checking NTP step-tickers file', '- 检查 NTP step-tickers 文件'),
              ('Use step-tickers file for quicker time synchronization', '使用 step-tickers 文件加快时间同步'),
              ('Result: ${FILE} is not empty, which is fine', '结果：${FILE} 不为空，状态正常'),
              ('Result: $I exist in ${FILE}', '结果：${I} 存在于 ${FILE}'),
              ('Result: ${I} does NOT exist in ${FILE}', '结果：${I} 不存在于 ${FILE}'),
              ('- Checking step-tickers ntp servers entries', '- 检查 step-tickers 中的 NTP 服务器条目'),
              ('Some time servers missing in step-tickers file', 'step-tickers 文件中缺少部分时间服务器'),
              ('Result: all time servers are in step-tickers file', '结果：所有时间服务器都在 step-tickers 文件中'),
              ('Information: step-tickers is used by ntpdate where as ntp.conf is the configuration file for the ntpd daemon. ntpdate is initially run to set the clock before ntpd to make sure time is within 1000 sec.', '信息：step-tickers 由 ntpdate 使用，而 ntp.conf 是 ntpd 的配置文件。ntpdate 会在 ntpd 启动前设置时钟，确保时间差在 1000 秒以内。'),
              ('Risk: ntp will not run at boot if the time difference between the server and client by more then 1000 sec.', '风险：如果服务器与客户端的时间差超过 1000 秒，NTP 可能无法在启动时运行。'),
              ('Check configuration files', '检查时间同步配置文件'),
              ('Result: found ${FILE}', '结果：发现 ${FILE}'),
              ('Found world writable configuration file', '发现所有用户均可写的配置文件'),
              ('Report if ntpctl cannot communicate with OpenNTPD', '检查 ntpctl 是否无法与 OpenNTPD 通信'),
              ('OpenNTPD found, but ntpctl cannot communicate with', '发现 OpenNTPD，但 ntpctl 无法与其通信'),
              ('Restart OpenNTPD', '重启 OpenNTPD'),
              ('Check status of OpenNTPD time synchronisation', '检查 OpenNTPD 时间同步状态'),
              ('OpenNTPD is not synchronising system time', 'OpenNTPD 未同步系统时间'),
              ('text:Set time manually once or check network connectivity.', 'text:手动设置一次时间，或检查网络连接。'),
              ('Check OpenNTPD has working peers', '检查 OpenNTPD 是否有可用的对等节点'),
              ('OpenNTPD has no peers', 'OpenNTPD 没有可用的对等节点'),
              ('Check systemd-timesyncd synchronized time', '检查 systemd-timesyncd 时间同步'),
              ('systemd-timesyncd did not synchronized the time recently.', 'systemd-timesyncd 最近没有同步时间。'),
              ('- Last time synchronization', '- 上次时间同步'),
              ('Result: systemd-timesyncd synchronized time ${FIND} seconds ago.', '结果：systemd-timesyncd 在 ${FIND} 秒前完成时间同步。'),
              ('systemd-timesyncd never successfully synchronized time', 'systemd-timesyncd 从未成功同步时间'),
              ('--result "EMPTY FILE"', '--result "空文件"'),
              ('--result "SOME MISSING"', '--result "部分缺失"'),
          ]

          required = ['Check for running NTP daemon or client', 'Check NTP protocol version', 'Check systemd-timesyncd synchronized time']
          for marker in required:
              if marker not in original:
                  raise SystemExit(f'missing required marker: {marker}')

          changed = 0
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
                  changed += 1

          if changed < 105:
              raise SystemExit(f'too few replacements applied: {changed}')

          path.write_text(text, encoding='utf-8')
          print(f'applied {changed} time translations')
          PY

          sh -n include/tests_time

      - name: Commit localized time checks and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/localize-time.yml
          git config user.name "AshFog Localization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add include/tests_time .github/workflows/localize-time.yml
          git commit -m "i18n: translate time synchronization checks"
          git push origin HEAD:master
