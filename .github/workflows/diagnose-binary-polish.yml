name: One-time diagnose binary polish

on:
  push:
    branches: [master]
    paths: [.github/workflows/diagnose-binary-polish.yml]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Extract and execute first polish script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/polish-binaries-output-audit.yml').read_text(encoding='utf-8')
          marker="          python3 - <<'PY'\n"
          start=wf.index(marker)+len(marker)
          end=wf.index("\n          PY",start)
          raw=wf[start:end]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())+'\n'
          Path('/tmp/binary-polish.py').write_text(code,encoding='utf-8')
          PY
          set +e
          python3 /tmp/binary-polish.py > /tmp/python.out 2>&1
          PY_STATUS=$?
          sh -n include/binaries > /tmp/syntax.out 2>&1
          SH_STATUS=$?
          set -e
          {
            echo "python_status=${PY_STATUS}"
            echo "sh_status=${SH_STATUS}"
            echo "--- python output ---"
            cat /tmp/python.out
            echo "--- sh output ---"
            cat /tmp/syntax.out
          } > BINARY_POLISH_DIAGNOSTIC.txt
          if [ ${PY_STATUS} -ne 0 ] || [ ${SH_STATUS} -ne 0 ]; then
            git checkout -- include/binaries
          fi
      - name: Commit diagnostic and remove workflows
        shell: bash
        run: |
          rm -f .github/workflows/diagnose-binary-polish.yml
          rm -f .github/workflows/polish-binaries-output-audit.yml
          git config user.name "AshFog Localization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: diagnose binary output polish"
          git push origin HEAD:master
