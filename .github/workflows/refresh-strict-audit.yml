name: One-time refresh strict localization audit
on:
  push:
    branches: [master]
    paths: [.github/workflows/refresh-strict-audit.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: master, fetch-depth: 0}
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          q=re.compile(r'"((?:\\.|[^"\\])*)"'); cjk=re.compile(r'[\u3400-\u9fff]'); word=re.compile(r'[A-Za-z]{2,}')
          ignore={'Linux','FreeBSD','OpenBSD','NetBSD','Solaris','AIX','macOS','DragonFly','YES','NO','OK','NONE','ACTIVE','ENABLED','DISABLED','FOUND','UNKNOWN','RUNNING','NOT FOUND','NOT ACTIVE','DONE','SKIPPED','WARNING','security','basics','performance','privacy','systemd','auditd','root','hostname -s','-',''}
          def ids(line,sp):
            s=line.lstrip(); o=set()
            if not s or s.startswith('#'): return o
            if 'Register ' in line and '--description' in line:
              p=line.find('--description');
              for i,m in enumerate(sp):
                if m.start()>p:o.add(i);break
            if 'Display ' in line:
              for f in ('--text','--result'):
                p=line.find(f)
                if p>=0:
                  for i,m in enumerate(sp):
                    if m.start()>p:o.add(i);break
            if any(x in line for x in ('DisplayError ','DisplayWarning ','DisplaySuggestion ')) and sp:o.add(0)
            if 'LogText ' in line:
              p=line.find('LogText ')
              for i,m in enumerate(sp):
                if m.start()>p:o.add(i);break
            for fn in ('ReportWarning ','ReportSuggestion ','ReportException '):
              p=line.find(fn)
              if p>=0:
                a=[i for i,m in enumerate(sp) if m.start()>p];o.update(a[1:])
            if 'SKIPREASON=' in line:
              p=line.find('SKIPREASON=')
              for i,m in enumerate(sp):
                if m.start()>p:o.add(i);break
            if s.startswith(('echo ','printf ')) or re.match(r'^(?:if .*; then )?(?:echo|printf) ',s):
              if not re.search(r'>\s*\$?\{?(?:LOGFILE|REPORTFILE|SETTINGS_FILE|TMPFILE)',line):o.update(range(len(sp)))
            return o
          def cand(x):
            if cjk.search(x):return False
            x=x.strip()
            if x in ignore or x.startswith(('http://','https://')):return False
            if '=' in x and ' ' not in x:return False
            z=re.sub(r'\$\{[^}]+\}|\$[A-Za-z_][A-Za-z0-9_]*|/\S+|--\S+|\[[^]]+\]|https?://\S+',' ',x)
            return len(word.findall(z))>=2
          rows=[]; cnt=Counter(); files=[Path('lynis')]+sorted(p for p in Path('include').iterdir() if p.is_file())
          for p in files:
            try:ls=p.read_text(encoding='utf-8').splitlines()
            except UnicodeDecodeError:continue
            for n,line in enumerate(ls,1):
              sp=list(q.finditer(line))
              for i in ids(line,sp):
                x=sp[i].group(1)
                if cand(x): rows.append(f'{p}:{n}: {x}');cnt[str(p)]+=1
          out=['# Strict untranslated visible strings',f'# Count: {len(rows)}','', '# Counts by file']+[f'# {v:4d} {k}' for k,v in sorted(cnt.items(),key=lambda z:(-z[1],z[0]))]+['',*rows,'']
          Path('VISIBLE_ENGLISH_STRICT.txt').write_text('\n'.join(out),encoding='utf-8')
          print(len(rows))
          PY
          rm -f .github/workflows/refresh-strict-audit.yml
          git config user.name 'AshFog Localization Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add VISIBLE_ENGLISH_STRICT.txt .github/workflows/refresh-strict-audit.yml
          git commit -m 'chore: refresh strict localization audit'
          git push origin HEAD:master
