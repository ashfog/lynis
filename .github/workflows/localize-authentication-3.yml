name: One-time authentication localization batch 3

on:
  push:
    branches: [master]
    paths: [.github/workflows/localize-authentication-3.yml]

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Translate umask, LDAP, failed login, and doas checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('include/tests_authentication')
          text = path.read_text(encoding='utf-8')
          original = text
          replacements = [
              ('Default umask values', '默认 umask 值'),
              ('- Determining default umask', '- 确定默认 umask'),
              ('Test: Checking ${ROOTDIR}etc/profile.d directory', '检查：检查 ${ROOTDIR}etc/profile.d 目录'),
              ('Result: found /etc/profile.d, with one or more files in it', '结果：发现 /etc/profile.d，且其中包含一个或多个文件'),
              ("Result: found a strong umask '${MASK}' set in ${FILE}", "结果：文件 ${FILE} 设置了较严格的 umask '${MASK}'"),
              ("Result: found a weak umask '${MASK}' set in ${FILE}", "结果：文件 ${FILE} 设置了较宽松的 umask '${MASK}'"),
              ('Result: found /etc/profile.d, but it does not contain any files', '结果：发现 /etc/profile.d，但其中没有文件'),
              ('Result: /etc/profile.d not found', '结果：未找到 /etc/profile.d'),
              ('Test: Checking /etc/profile', '检查：检查 /etc/profile'),
              ('Result: file /etc/profile exists', '结果：文件 /etc/profile 存在'),
              ('Test: Checking umask value in /etc/profile', '检查：检查 /etc/profile 中的 umask 值'),
              ('Result: did not find umask in /etc/profile', '结果：未在 /etc/profile 中发现 umask'),
              ('Result: found umask (prefixed with spaces)', '结果：发现带前导空格的 umask 配置'),
              ('Result: found umask ${FIND}, which could be more strict', '结果：发现 umask ${FIND}，可以设置得更严格'),
              ('Result: found umask ${FIND}, which is fine', '结果：发现 umask ${FIND}，设置正常'),
              ('Result: found multiple umask values configured in /etc/profile', '结果：/etc/profile 中配置了多个 umask 值'),
              ('Result: umask ${I} could be more strict', '结果：umask ${I} 可以设置得更严格'),
              ('Result: Found umask ${I}, which is fine', '结果：发现 umask ${I}，设置正常'),
              ('Some umasks found could be more strict (e.g. 027)', '发现部分 umask 可以设置得更严格（例如 027）'),
              ('Default umask in /etc/profile or /etc/profile.d/custom.sh could be more strict (e.g. 027)', '可以将 /etc/profile 或 /etc/profile.d/custom.sh 中的默认 umask 设置得更严格（例如 027）'),
              ('Result: found no umask. Please check if this is correct', '结果：未发现 umask，请确认这是否符合预期'),
              ('Test: Checking umask entries in /etc/passwd (pam_umask)', '检查：检查 /etc/passwd 中的 umask 条目（pam_umask）'),
              ('Result: file /etc/passwd exists', '结果：文件 /etc/passwd 存在'),
              ('Test: Checking umask value in /etc/passwd', '检查：检查 /etc/passwd 中的 umask 值'),
              ('Result: file /etc/passwd does not exist', '结果：文件 /etc/passwd 不存在'),
              ('Test: Checking /etc/login.defs', '检查：检查 /etc/login.defs'),
              ('Result: file /etc/login.defs exists', '结果：文件 /etc/login.defs 存在'),
              ('Test: Checking umask value in /etc/login.defs', '检查：检查 /etc/login.defs 中的 umask 值'),
              ('Result: umask value is not configured (most likely it will have the default 022 value)', '结果：未配置 umask 值，通常会使用默认值 022'),
              ('Default umask in /etc/login.defs could not be found and defaults usually to 022, which could be more strict like 027', '未在 /etc/login.defs 中找到默认 umask；通常默认为 022，可以改为更严格的 027'),
              ('Result: umask is ${FIND}, which is fine', '结果：umask 为 ${FIND}，设置正常'),
              ('Result: found umask ${FIND}, which could be improved', '结果：发现 umask ${FIND}，可以进一步收紧'),
              ('Default umask in /etc/login.defs could be more strict like 027', '可以将 /etc/login.defs 中的默认 umask 设置得更严格，例如 027'),
              ('Result: file /etc/login.defs does not exist', '结果：文件 /etc/login.defs 不存在'),
              ('Test: Checking /etc/init.d/functions', '检查：检查 /etc/init.d/functions'),
              ('Result: file /etc/init.d/functions exists', '结果：文件 /etc/init.d/functions 存在'),
              ('Test: Checking umask value in /etc/init.d/functions', '检查：检查 /etc/init.d/functions 中的 umask 值'),
              ('Result: umask is not configured', '结果：未配置 umask'),
              ('Result: file /etc/init.d/functions does not exist', '结果：文件 /etc/init.d/functions 不存在'),
              ('Test: Checking /etc/init.d/rc', '检查：检查 /etc/init.d/rc'),
              ('Result: file /etc/init.d/rc exists', '结果：文件 /etc/init.d/rc 存在'),
              ('Test: Checking UMASK value in /etc/init.d/rc', '检查：检查 /etc/init.d/rc 中的 UMASK 值'),
              ('Result: UMASK value is not configured (most likely it will have the default 022 value)', '结果：未配置 UMASK 值，通常会使用默认值 022'),
              ('- Checking umask (/etc/init.d/rc)', '- 检查 umask（/etc/init.d/rc）'),
              ('Default umask in /etc/init.d/rc could not be found and defaults usually to 022, which could be more strict like 027', '未在 /etc/init.d/rc 中找到默认 umask；通常默认为 022，可以改为更严格的 027'),
              ('Default umask in /etc/init.d/rc could be more strict like 027', '可以将 /etc/init.d/rc 中的默认 umask 设置得更严格，例如 027'),
              ('Result: file /etc/init.d/rc does not exist', '结果：文件 /etc/init.d/rc 不存在'),
              ('Result: file /etc/login.conf exists', '结果：文件 /etc/login.conf 存在'),
              ('Result: found umask value ${UMASK_VALUE}, which is fine', '结果：发现 umask 值 ${UMASK_VALUE}，设置正常'),
              ('Result: found umask value ${UMASK_VALUE}, which can be more strict', '结果：发现 umask 值 ${UMASK_VALUE}，可以设置得更严格'),
              ('Umask in /etc/login.conf could be more strict like 027', '可以将 /etc/login.conf 中的 umask 设置得更严格，例如 027'),
              ('Result: no umask setting found in /etc/login.conf, which is unexpected', '结果：未在 /etc/login.conf 中发现 umask 配置，这不符合预期'),
              ('Test: Checking /etc/init.d/rcS', '检查：检查 /etc/init.d/rcS'),
              ('Result: file /etc/init.d/rcS exists', '结果：文件 /etc/init.d/rcS 存在'),
              ('Test: Checking if script runs another script.', '检查：确认脚本是否会执行另一个脚本。'),
              ('- Checking umask (/etc/init.d/rcS)', '- 检查 umask（/etc/init.d/rcS）'),
              ('Default umask in /etc/init.d/rcS could not be found and defaults usually to 022, which could be more strict like 027', '未在 /etc/init.d/rcS 中找到默认 umask；通常默认为 022，可以改为更严格的 027'),
              ('Result: umask is ${FIND2}, which is fine', '结果：umask 为 ${FIND2}，设置正常'),
              ('Result: found umask ${FIND2}, which could be improved', '结果：发现 umask ${FIND2}，可以进一步收紧'),
              ('Default umask in /etc/init.d/rcS could be more strict like 027', '可以将 /etc/init.d/rcS 中的默认 umask 设置得更严格，例如 027'),
              ('Result: exec line present in file, setting of umask not needed in this script', '结果：文件中存在 exec 行，此脚本无需单独设置 umask'),
              ('Result: file /etc/init.d/rcS does not exist', '结果：文件 /etc/init.d/rcS 不存在'),
              ('Solaris account locking', 'Solaris 账户锁定'),
              ('Result: found ${ROOTDIR}etc/security/policy.conf', '结果：发现 ${ROOTDIR}etc/security/policy.conf'),
              ('Result: account locking option set', '结果：已设置账户锁定选项'),
              ('Result: option LOCK_AFTER_RETRIES not set', '结果：未设置 LOCK_AFTER_RETRIES 选项'),
              ('Result: ${ROOTDIR}etc/security/policy.conf does not exist', '结果：${ROOTDIR}etc/security/policy.conf 不存在'),
              ('Test: checking ${ROOTDIR}etc/default/login', '检查：检查 ${ROOTDIR}etc/default/login'),
              ('Result: file ${ROOTDIR}etc/default/login exists', '结果：文件 ${ROOTDIR}etc/default/login 存在'),
              ('Result: retries option configured', '结果：已配置重试次数选项'),
              ('Result: retries option not configured', '结果：未配置重试次数选项'),
              ('Result: file ${ROOTDIR}etc/default/login does not exist', '结果：文件 ${ROOTDIR}etc/default/login 不存在'),
              ('- Checking account locking', '- 检查账户锁定'),
              ('Query LDAP authentication support', '查询 LDAP 身份验证支持'),
              ('Result: LDAP authentication not enabled', '结果：未启用 LDAP 身份验证'),
              ('- LDAP authentication support', '- LDAP 身份验证支持'),
              ('Result: LDAP authentication enabled', '结果：已启用 LDAP 身份验证'),
              ('Query LDAP servers in client configuration', '查询客户端配置中的 LDAP 服务器'),
              ('Test: checking ldap.conf options', '检查：检查 ldap.conf 选项'),
              ('Test: checking ${FILE}', '检查：检查 ${FILE}'),
              ('Result: file ${FILE} exists, LDAP being used', '结果：文件 ${FILE} 存在，正在使用 LDAP'),
              ('Test: checking LDAP servers in file ${FILE}', '检查：检查文件 ${FILE} 中的 LDAP 服务器'),
              ('LDAP server: ${SERVER}', 'LDAP 服务器：${SERVER}'),
              ('Result: found LDAP server ${SERVER}', '结果：发现 LDAP 服务器 ${SERVER}'),
              ('Result: ${FILE} does NOT exist', '结果：${FILE} 不存在'),
              ('Logging of failed login attempts', '记录失败的登录尝试'),
              ('Result: found ${ROOTDIR}var/run/faillock directory', '结果：发现 ${ROOTDIR}var/run/faillock 目录'),
              ('Result: found ${ROOTDIR}var/log/tallylog with a size bigger than zero', '结果：发现 ${ROOTDIR}var/log/tallylog，且文件大小大于 0'),
              ('Result: did not find ${ROOTDIR}var/run/faillock directory or ${ROOTDIR}var/log/tallylog file on disk or its file size is zero bytes', '结果：未找到 ${ROOTDIR}var/run/faillock 目录或 ${ROOTDIR}var/log/tallylog 文件，或者文件大小为 0'),
              ('Result: found pam_faillock module on disk', '结果：磁盘上发现 pam_faillock 模块'),
              ('Result: found pam_tally2 module on disk', '结果：磁盘上发现 pam_tally2 模块'),
              ('Outcome: authentication failures are logged using pam_faillock', '结论：使用 pam_faillock 记录身份验证失败'),
              ('Outcome: authentication failures are logged using pam_tally2', '结论：使用 pam_tally2 记录身份验证失败'),
              ('Outcome: it looks like pam_faillock or pam_tally2 is not configured to log failed login attempts', '结论：pam_faillock 或 pam_tally2 似乎未配置为记录失败的登录尝试'),
              ('Test: Checking FAILLOG_ENAB option in ${ROOTDIR}etc/login.defs ', '检查：检查 ${ROOTDIR}etc/login.defs 中的 FAILLOG_ENAB 选项 '),
              ("Result: FAILLOG_ENAB is set to 'yes'", "结果：FAILLOG_ENAB 设置为 'yes'"),
              ('Outcome: failed login attempts are logged in ${ROOTDIR}var/log/faillog', '结论：失败的登录尝试记录在 ${ROOTDIR}var/log/faillog'),
              ('- Logging failed login attempts', '- 记录失败的登录尝试'),
              ('Result: failed login attempts may not logged', '结果：失败的登录尝试可能未被记录'),
              ('Checking /etc/doas.conf file', '检查 /etc/doas.conf 文件'),
              ('Test: checking presence /etc/doas.conf', '检查：确认 /etc/doas.conf 是否存在'),
              ('Result: file /etc/doas.conf found', '结果：发现 /etc/doas.conf 文件'),
              ('Result: file /etc/doas.conf not found', '结果：未找到 /etc/doas.conf 文件'),
              ('Result: /etc/doas.conf file found', '结果：发现 /etc/doas.conf 文件'),
              ('- doas file', '- doas 文件'),
              ('Result: doas file NOT found', '结果：未找到 doas 文件'),
              ('Check /etc/doas.conf file permissions', '检查 /etc/doas.conf 文件权限'),
              ('Test: checking /etc/doas.conf permissions', '检查：检查 /etc/doas.conf 权限'),
              ('Result: Found /etc/doas.conf file permissions: ${FIND}', '结果：/etc/doas.conf 文件权限为 ${FIND}'),
              ('Result: file /etc/doas.conf has correct permissions', '结果：/etc/doas.conf 文件权限正确'),
              ('- Check doas file permissions', '- 检查 doas 文件权限'),
              ('Result: file has possibly unsafe file permissions', '结果：文件权限可能不安全'),
          ]

          required = ['Default umask values', 'Logging of failed login attempts', 'Checking /etc/doas.conf file']
          for marker in required:
              if marker not in original:
                  raise SystemExit(f'missing source marker: {marker}')

          applied = 0
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
                  applied += 1
          if applied < 100:
              raise SystemExit(f'too few replacements applied: {applied}')

          path.write_text(text, encoding='utf-8')
          print(f'applied {applied} final authentication translations')
          PY

          sh -n include/tests_authentication

      - name: Commit translations and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/localize-authentication-3.yml
          git config user.name "AshFog Localization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add include/tests_authentication .github/workflows/localize-authentication-3.yml
          git commit -m "i18n: complete authentication and account localization"
          git push origin HEAD:master
